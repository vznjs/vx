name = "vx-cloud"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-secret). Secrets like signing keys go via
#   `wrangler secret put VX_REMOTE_CACHE_SIGNATURE_KEY`
[vars]
VX_PROTOCOL_VERSION = "1.0"

# D1 — relational store (orgs, members, runs, run_tasks, run_events).
# Create with `bun wrangler d1 create vx_cloud`, paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "vx_cloud"
database_id = "TODO: replace with id from `wrangler d1 create vx_cloud`"
migrations_dir = "migrations"

# R2 — content-addressed cache artifacts (per-org key prefix).
# Create with `bun wrangler r2 bucket create vx-cloud-artifacts`.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "vx-cloud-artifacts"

# KV — token-cache + per-org feature flags. Sub-ms global reads.
# Create with `bun wrangler kv namespace create TOKEN_CACHE`, then paste id.
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "TODO: replace with id from `wrangler kv namespace create TOKEN_CACHE`"

# Queues — event-ingest buffer; CI noisy runs (500+ events/sec) absorb here.
# Create with `bun wrangler queues create vx-event-ingest`.
[[queues.producers]]
binding = "EVENT_INGEST"
queue = "vx-event-ingest"

[[queues.consumers]]
queue = "vx-event-ingest"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "vx-event-ingest-dlq"

# Durable Objects — stateful per-run coordinator + per-hash dedup.
[[durable_objects.bindings]]
name = "RUN_COORDINATOR"
class_name = "RunCoordinatorDO"

[[durable_objects.bindings]]
name = "INFLIGHT_DEDUP"
class_name = "InflightDedupDO"

# Migrations register the DO classes for v1 wrangler deploys.
[[migrations]]
tag = "v1"
new_classes = ["RunCoordinatorDO", "InflightDedupDO"]
