# vx's three servers, built from this repo:
#   docker compose up -d                 # all three
#   docker compose up -d cache history   # only the ones you need
# The relay of @vzn/vx-dte on :8080, the cache on :8081, the timings on
# :8082 (DTE_PORT, CACHE_PORT, HISTORY_PORT move them). Each reads its
# settings from your shell or a .env beside this file, as its README
# names them. Put TLS in front of each: CI tokens are bearer tokens.
services:
  dte:
    build: ../../packages/vx-dte-server
    command: [--allow, '${DTE_ALLOW:-}', --audience, '${DTE_AUDIENCE:-}']
    # Stores nothing: after a restart, vx-dte joins each run in flight again.
    ports: ['${DTE_PORT:-8080}:8080']
    restart: unless-stopped
  cache:
    build: { context: ../.., dockerfile: packages/vx-cache-server/Dockerfile }
    environment:
      - ALLOW
      - AUDIENCE
      - READ_ACCESS
      - S3_BUCKET
      - S3_ENDPOINT
      - S3_REGION
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_SESSION_TOKEN
      - MAX_CHECK_HASHES
      - MAX_UPLOAD_BYTES
    ports: ['${CACHE_PORT:-8081}:8080']
    restart: unless-stopped
  history:
    build: { context: ../.., dockerfile: packages/vx-history-server/Dockerfile }
    environment:
      - ALLOW
      - AUDIENCE
      - READ_ACCESS
      - TIMING_DAYS
    volumes: ['history:/data']
    ports: ['${HISTORY_PORT:-8082}:8080']
    restart: unless-stopped
volumes:
  history:
