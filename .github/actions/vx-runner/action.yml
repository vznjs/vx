name: vx runner
description: >-
  What a Linux runner needs before `vx run` can execute this repo's sandboxed
  tasks: the sandbox runtime's dependencies and a proof they work.

runs:
  using: composite
  steps:
    # The packages, cached per runner image: on a hit the install is a
    # local dpkg of a few debs, not an apt index fetch (14 to 52 s on an
    # agent's critical path, 2026-10-22).
    - name: Key the sandbox runtime's packages
      id: debs
      shell: bash
      run: |
        echo "key=vx-runner-debs-$ImageOS-$ImageVersion-$(uname -m)" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.vx-runner-debs" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.debs.outputs.dir }}
        key: ${{ steps.debs.outputs.key }}

    # Sandbox runtime deps: bubblewrap (kernel-level isolation) + socat
    # (network bridge) on Linux, plus strace (per-task violation
    # detection), and an AppArmor profile that lets bwrap make its user
    # namespaces.
    - name: Install sandbox runtime deps
      shell: bash
      env:
        DEBS: ${{ steps.debs.outputs.dir }}
      run: |
        # man-db re-indexes every page on each install: seconds for nothing.
        sudo rm -f /var/lib/man-db/auto-update
        if ls "$DEBS"/*.deb > /dev/null 2>&1; then
          sudo dpkg -i "$DEBS"/*.deb
        else
          # Only Ubuntu's own index is needed. The image also carries
          # third-party sources (Chrome, Microsoft) whose mirrors can serve
          # a stale index — `apt-get update` then exits 100 on a hash-sum
          # mismatch before a single vx step runs (two heads on 2026-09-09).
          # Drop them so the gate depends on the one repository it uses.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update
          mkdir -p "$DEBS/partial"
          # The debs it fetches stay in $DEBS, which a later step saves.
          sudo apt-get install -y -o Dir::Cache::Archives="$DEBS" \
            -o APT::Keep-Downloaded-Packages=true bubblewrap socat strace ripgrep
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chown -R "$USER" "$DEBS"
          touch "$RUNNER_TEMP/vx-runner.fetched"
        fi
        # Ubuntu 24+ lets a program create user namespaces only under an
        # AppArmor profile that grants `userns`; its documented way for one
        # program is such a profile (discourse.ubuntu.com/t/58007), which
        # keeps the restriction for every other. Ubuntu 26 ships
        # bwrap-userns-restrict for bwrap instead, which strips the
        # capabilities of the namespace nested in bwrap's, where the
        # sandbox applies seccomp: every sandboxed task failed "nested
        # userns is capability-restricted" (2026-10-23). So bwrap gets
        # the plain profile in its place.
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          sudo rm /etc/apparmor.d/bwrap-userns-restrict
        fi
        printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
          'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' |
          sudo tee /etc/apparmor.d/bwrap > /dev/null
        sudo apparmor_parser -r /etc/apparmor.d/bwrap

    # A miss saves what it fetched; agents racing to save one key lose
    # with a warning, not a failure.
    - name: Has the install fetched packages
      id: fetched
      shell: bash
      run: echo "yes=$([ -e "$RUNNER_TEMP/vx-runner.fetched" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - if: steps.fetched.outputs.yes == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.debs.outputs.dir }}
        key: ${{ steps.debs.outputs.key }}

    # Diagnose: confirm bwrap actually runs on this host before firing a
    # single task. Surfaces install / namespace issues directly in CI logs
    # instead of as opaque "tests skipped".
    - name: Diagnose sandbox availability
      shell: bash
      run: |
        echo "::group::which bwrap"
        which bwrap || echo "MISSING"
        bwrap --version || true
        echo "::endgroup::"
        echo "::group::sysctl userns"
        sysctl kernel.unprivileged_userns_clone 2>&1 || true
        sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
        echo "::endgroup::"
        echo "::group::bwrap minimal exec"
        bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
        echo "ok: bwrap exited 0"
        echo "::endgroup::"
        echo "::group::probeSandbox()"
        bun -e 'import("./packages/vx/src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => { console.log(JSON.stringify(a)); process.exit(0) })'
        echo "::endgroup::"
        echo "::group::coreutils probe"
        readlink -f "$(command -v cat)" "$(command -v sleep)"
        cat --version | head -1
        strace -f -e trace=openat,statx,newfstatat,access,faccessat2 cat /vx-no-such-file 2>&1 | tail -5 || true
        echo "::endgroup::"
