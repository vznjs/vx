name: vx runner
description: >-
  What a Linux runner needs before `vx run` can execute this repo's sandboxed
  tasks: the sandbox runtime's dependencies and a proof they work.

inputs:
  # A DTE agent's warm-up is on its run's critical path: `start` launches
  # the install in the background (about 9 s of apt), `finish` waits for it
  # and proves it, so `bun install` runs in between. `all` is both at once.
  phase:
    description: all, start or finish
    default: all

runs:
  using: composite
  steps:
    # Sandbox runtime deps: bubblewrap (kernel-level isolation) + socat
    # (network bridge) on Linux, plus strace (per-task violation
    # detection). Ubuntu 24's default AppArmor profile blocks unprivileged
    # user namespaces — that breaks bwrap. We disable the restriction via
    # sysctl so the sandbox tests can actually exercise bwrap end-to-end.
    - name: Install sandbox runtime deps
      if: inputs.phase != 'finish'
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
      run: |
        install() (
          set -e
          # Only Ubuntu's own index is needed. The image also carries
          # third-party sources (Chrome, Microsoft) whose mirrors can serve
          # a stale index — `apt-get update` then exits 100 on a hash-sum
          # mismatch before a single vx step runs (two heads on 2026-09-09).
          # Drop them so the gate depends on the one repository it uses.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat strace ripgrep
          # Ubuntu 24+ ships with AppArmor restricting unprivileged user
          # namespaces. bwrap needs them; without this sysctl tweak it exits
          # non-zero on first use.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # AppArmor profile-based restriction (Ubuntu 24.04+): some builds
          # also enforce via the unprivileged_userns profile.
          if [ -f /etc/apparmor.d/unprivileged_userns ]; then
            sudo aa-disable /etc/apparmor.d/unprivileged_userns || true
          fi
        )
        if [ "$PHASE" = start ]; then
          # The runner keeps a step's background process alive into later steps.
          nohup bash -c "$(declare -f install); set +e; install; echo \$? > '$RUNNER_TEMP/vx-runner.done'" \
            > "$RUNNER_TEMP/vx-runner.log" 2>&1 &
        else
          install
        fi

    - name: Wait for sandbox runtime deps
      if: inputs.phase == 'finish'
      shell: bash
      run: |
        until [ -e "$RUNNER_TEMP/vx-runner.done" ]; do sleep 0.2; done
        cat "$RUNNER_TEMP/vx-runner.log"
        exit "$(cat "$RUNNER_TEMP/vx-runner.done")"

    # Diagnose: confirm bwrap actually runs on this host before firing a
    # single task. Surfaces install / namespace issues directly in CI logs
    # instead of as opaque "tests skipped".
    - name: Diagnose sandbox availability
      if: inputs.phase != 'start'
      shell: bash
      run: |
        echo "::group::which bwrap"
        which bwrap || echo "MISSING"
        bwrap --version || true
        echo "::endgroup::"
        echo "::group::sysctl userns"
        sysctl kernel.unprivileged_userns_clone 2>&1 || true
        sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
        echo "::endgroup::"
        echo "::group::bwrap minimal exec"
        bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
        echo "ok: bwrap exited 0"
        echo "::endgroup::"
        echo "::group::probeSandbox()"
        bun -e 'import("./packages/vx/src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => { console.log(JSON.stringify(a)); process.exit(0) })'
        echo "::endgroup::"
