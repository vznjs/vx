name: Conformance

# Every conformance case against vx and the rivals at their latest releases
# (@vzn/vx-conformance#conformance), weekly (2026-11-21): Turbo, Nx, Vite
# Task and moon install from npm's latest inside the run, Nix from its
# installer's latest, never pinned. The Monday rival sweep dispatches it
# when it ends, so the sweep's new cases count; the cron is the fallback
# should the sweep not. It uploads the results as the `conformance-data`
# artifact; main's next deploy shows the rivals' outcomes from it
# (@vzn/vx-docs#build.live). A case vx fails turns the run red. Each job
# runs one tool on a third of the cases; `merge` joins them
# (@vzn/vx-conformance#conformance.merge).

on:
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:

permissions: {}

# One run per ref at a time; runs on different branches go side by side.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each job runs one tool on every third case (cli.ts --shard), so the
  # suite takes minutes, not the 50 one job took (2026-11-22).
  conformance:
    name: ${{ matrix.tool }} ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [vx, turbo, nx, vite-task, nix, moon]
        shard: [1, 2, 3]
    env:
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      # Nix runs outside bubblewrap, in its own build sandbox: a user
      # namespace Ubuntu's AppArmor allows only bwrap by default.
      - name: Install Nix
        if: matrix.tool == 'nix'
        run: |
          curl -sSfL https://nixos.org/nix/install | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: vx run conformance
        run: bun packages/vx/src/bin.ts run @vzn/vx-conformance#conformance -- --tool ${{ matrix.tool }} --shard ${{ matrix.shard }}/3 --out shard.json
      - name: Upload the shard's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-shard-${{ matrix.tool }}-${{ matrix.shard }}
          path: private/vx-conformance/shard.json
          if-no-files-found: ignore

  merge:
    name: Conformance
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: Download the shards' results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-shard-*
          path: private/vx-conformance/shards
      - name: vx run conformance.merge
        run: bun packages/vx/src/bin.ts run @vzn/vx-conformance#conformance.merge
      - name: Upload the conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-data
          path: private/vx-conformance/conformance.json
