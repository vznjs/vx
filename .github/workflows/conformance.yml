name: Conformance

# Every conformance case against vx and the rivals at their latest releases
# (@vzn/vx-conformance#conformance), weekly (2026-11-21): Turbo, Nx, Vite
# Task and moon install from npm's latest inside the run, Nix from its
# installer's latest, never pinned. The Monday rival sweep dispatches it
# when it ends, so the sweep's new cases count; the cron is the fallback
# should the sweep not. It uploads the results as the `conformance-data`
# artifact; main's next deploy shows the rivals' outcomes from it
# (@vzn/vx-docs#build.live). A case vx fails turns the run red. Each job
# runs one tool on its share of the cases; `merge` joins them
# (@vzn/vx-conformance#conformance.merge).

on:
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:

permissions: {}

# One run per ref at a time; runs on different branches go side by side.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each job runs one tool on its share of the cases (cli.ts --shard), so
  # every share takes about 90 s. A tool's whole suite (2026-11-22, run
  # 45064874265): vx 540 s, Turbo 350, Nx 1180, Vite Task 100, Nix 380, moon
  # 3710 (about 850 since its plugin cache is shared, EXTISM_CACHE_CONFIG);
  # set-up is ~15 s a job. At three shards a tool, moon's took 26 min.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          echo 'matrix={"include":'"$(jq -nc '{"vx":6,"turbo":4,"nx":14,"vite-task":2,"nix":5,"moon":10}
            | to_entries | map(.key as $t | .value as $n | range(1; $n + 1) | {tool: $t, shard: "\(.)/\($n)"})')"'}' >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.tool }} ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      # Nix runs outside bubblewrap, in its own build sandbox: a user
      # namespace Ubuntu's AppArmor allows only bwrap by default.
      - name: Install Nix
        if: matrix.tool == 'nix'
        run: |
          curl -sSfL https://nixos.org/nix/install | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: vx run conformance
        run: bun packages/vx/src/bin.ts run @vzn/vx-conformance#conformance -- --tool ${{ matrix.tool }} --shard ${{ matrix.shard }} --out shard.json
      - name: Upload the shard's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-shard-${{ matrix.tool }}-${{ strategy.job-index }}
          path: private/vx-conformance/shard.json
          if-no-files-found: ignore

  merge:
    name: Conformance
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: Download the shards' results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-shard-*
          path: private/vx-conformance/shards
      - name: vx run conformance.merge
        run: bun packages/vx/src/bin.ts run @vzn/vx-conformance#conformance.merge
      - name: Upload the conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-data
          path: private/vx-conformance/conformance.json
