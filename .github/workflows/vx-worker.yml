# The workers of a distributed run (@vzn/vx-dte's github()): CI's one job
# is a run, and dispatches this once per size with that size's workers as
# the matrix: `small` for the Linux work, `arm` for the arm64 binary, `mac`
# for the macOS tasks. Each worker proves itself to the relay and
# the run by its OIDC token; there is no secret.
name: vx-worker

on:
  workflow_dispatch:
    inputs:
      run: { required: true }
      relay: { required: true }
      sha: { required: true }
      size: { required: true }
      workers: { required: true }
      # The variables the run hands its workers (github({ env })), as a JSON object.
      env: { required: false, default: '{}' }

permissions:
  contents: read
  id-token: write

jobs:
  worker:
    name: ${{ matrix.worker }}
    runs-on: ${{ fromJSON('{"small":"ubuntu-latest","arm":"ubuntu-24.04-arm","mac":"macos-latest"}')[inputs.size] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    env:
      VX_DTE_RUN: ${{ inputs.run }}
      VX_DTE_RELAY: ${{ inputs.relay }}
      VX_DTE_WORKER: ${{ matrix.worker }}
    steps:
      # Spotlight indexes what the tasks write: 0.13-0.29 cores of a
      # 3-core Mac, and a fixed test workload ran 27.6 s on average with it
      # against 23.3 s without (2 runners each, 2026-10-24). In the
      # background: mdutil took up to 8 s.
      - if: runner.os == 'macOS'
        run: (sudo mdutil -a -i off && sudo mdutil -a -d) >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # One commit: the laws that read history fetch it themselves
        # (tests/helpers/history.ts). The full clone was 5-7 s of every
        # worker's warm-up.
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: The run's variables
        env:
          HANDED: ${{ inputs.env }}
        run: |
          jq -r 'to_entries[] | if (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) and (.value | type == "string") and (.value | test("[\r\n]") | not) then "\(.key)=\(.value)" else error("env \(.key): a name, and a string of one line") end' <<<"$HANDED" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sandbox runtime, as @vzn/vx-ci sets it up. Its packages are
      # kept per runner image: a hit installs them with no index fetch
      # (14 to 52 s of a worker's warm-up, 2026-10-22).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - id: setup
        run: bun packages/vx/src/bin.ts setup github
      - if: steps.setup.outputs.fetched == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: ${{ steps.setup.outputs.key }}

      - name: vx dte worker
        run: bun packages/vx/src/bin.ts dte worker
        env:
          # The worker's own store, out of the home the tests' guard watches:
          # it saves there while a suite runs (tests/helpers/home-guard.ts).
          VX_CACHE_DIR: ${{ runner.temp }}/vx-cache
