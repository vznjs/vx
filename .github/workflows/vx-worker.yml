# The workers of a distributed run (@vzn/vx-dte's github()): CI's one job
# is a run, and dispatches this once per size with that size's workers as
# the matrix: `small` for the Linux work, `arm` for the arm64 binary, `mac`
# for the macOS tasks. Each worker proves itself to the relay and
# the run by its OIDC token; there is no secret.
name: vx-worker

on:
  workflow_dispatch:
    inputs:
      run: { required: true }
      relay: { required: true }
      sha: { required: true }
      size: { required: true }
      workers: { required: true }

permissions:
  contents: read
  id-token: write

jobs:
  worker:
    name: ${{ matrix.worker }}
    runs-on: ${{ fromJSON('{"small":"ubuntu-latest","arm":"ubuntu-24.04-arm","mac":"macos-latest"}')[inputs.size] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    env:
      VX_DTE_RUN: ${{ inputs.run }}
      VX_DTE_RELAY: ${{ inputs.relay }}
      VX_DTE_WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The full history: the API-break law reads the last release's tag
        # and the commits after it; the PR-commit law walks base..head.
        # Without old blobs (fetched on demand, few differ from HEAD's): the
        # full clone was 5-7 s of every worker's warm-up.
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Bun's package cache: the run saved it before it started this worker.
      - id: bun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A platform the run is not (macOS, arm64) keeps its own.
      - if: steps.bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      # The sandbox runtime, as @vzn/vx-ci sets it up. Its packages are
      # kept per runner image: a hit installs them with no index fetch
      # (14 to 52 s of a worker's warm-up, 2026-10-22).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - id: setup
        run: bun packages/vx/src/bin.ts setup github
      - if: steps.setup.outputs.fetched == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: ${{ steps.setup.outputs.key }}

      - name: vx dte worker
        run: bun packages/vx/src/bin.ts dte worker
        env:
          # The worker's own store, out of the home the tests' guard watches:
          # it saves there while a suite runs (tests/helpers/home-guard.ts).
          VX_CACHE_DIR: ${{ runner.temp }}/vx-cache
