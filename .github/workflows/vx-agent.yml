# The agents of a distributed run (@vzn/vx-dte's github()): each of CI's
# two jobs is a run, and dispatches this once per size with that size's
# agents as the matrix: `small` for the Linux run, `mac` for the macOS one. Each agent proves itself to the relay and
# the run by its OIDC token; there is no secret.
name: vx-agent

on:
  workflow_dispatch:
    inputs:
      run: { required: true }
      relay: { required: true }
      sha: { required: true }
      size: { required: true }
      agents: { required: true }

permissions:
  contents: read
  id-token: write

jobs:
  agent:
    name: ${{ matrix.agent }}
    runs-on: ${{ fromJSON('{"small":"ubuntu-latest","mac":"macos-latest"}')[inputs.size] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(inputs.agents) }}
    env:
      VX_DTE_RUN: ${{ inputs.run }}
      VX_DTE_RELAY: ${{ inputs.relay }}
      VX_DTE_AGENT: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The full history: the API-break law reads the last release's tag
        # and the commits after it; the PR-commit law walks base..head.
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - if: runner.os == 'Linux'
        uses: ./.github/actions/vx-runner

      # A 2 MiB tmpfs for `tests/disk-full.unsafe.test.ts` (VX_SMALL_DISK,
      # which the Linux run passes): a disk that cannot be written cannot
      # be filled.
      - if: runner.os == 'Linux'
        name: Mount a small disk
        run: |
          sudo mkdir -p /tmp/vx-small
          sudo mount -t tmpfs -o size=2m tmpfs /tmp/vx-small
          sudo chown "$USER" /tmp/vx-small

      - name: vx dte agent
        run: bun packages/vx/src/bin.ts dte agent
