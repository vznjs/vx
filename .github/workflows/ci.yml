name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each group's merge before main moves.
  merge_group:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red.
  workflow_dispatch:

# Checkout is all the token does here: a PR's code runs in these jobs, and
# a default token may hold write access (L-29).
permissions:
  contents: read
  # The remote cache's token: turboCache({ oidc }) exchanges the job's OIDC
  # token with Vercel, no long-lived secret (.vx/workspace.ts).
  id-token: write

# A newer push to the same PR supersedes an older run, which is cancelled:
# its old head is never merged. Any other run (main, a dispatch) finishes
# and only the queued runs between it and the tip are dropped, or a busy
# main never completes a run, never releases (auto-release.yml) and never
# says it is red.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything Linux runs, as one distributed run (@vzn/vx-dte): this job
  # is the run and runs nothing itself (owner, 2026-10-22: "everything
  # should run in DTE"); github() dispatches vx-agent.yml for the agents,
  # which read the cache this job's token lends them. Core's `ci` task is
  # a group fanning out to `lint` (→ lint.oxlint + lint.oxfmt), `test` and
  # `check.binary` (the host binary, compiled the way release.yml does,
  # must launch and report the manifest version); every package's `ci`
  # runs its suite. The two cross-compiles run on an agent's cold Bun
  # cache, in bwrap: each target's runtime downloads from npm inside the
  # sandbox, as on a fresh laptop (2026-09-29).
  #
  # The job summary comes from `@vzn/vx-ci`, declared in .vx/workspace.ts;
  # it writes the verdict and the per-task table, so a red run says WHICH
  # task failed on the PR page. The env below travels with each task to
  # the agent that runs it, through each task's exec.env.passThrough.
  linux:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      actions: write
      # GITHUB_TOKEN dispatches the agents, so vx-ci posts the run's check too.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The default branch and its history: schedule-history finds the
        # merge-base's timings, which carry each task's measured need, so
        # agents pack tasks by it.
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No vx-runner (about 55 s of apt): every sandboxed task runs on an
      # agent, which enforces it there, so this job arms no sandbox.

      # vx's own cache, carried between runs: a run restores the newest
      # one main saved and replays every task whose key is unchanged, so a
      # PR re-runs only what it touched (owner, 2026-10-04). Only a push
      # to main saves, so a PR's code never writes an entry another run reads.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}
          restore-keys: vx-${{ runner.os }}-

      # Every run reads configs from the committed lock and trusts it; this
      # re-evaluates them and fails on drift.
      - name: vx lock --check
        run: bun packages/vx/src/bin.ts lock --check

      - name: A run id no one can guess
        run: echo "VX_DTE_RUN=$(uuidgen)" >> "$GITHUB_ENV"

      - name: vx run ci
        env:
          VX_DTE_RELAY: https://vx-dte-relay.exelord.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
          # An unavailable OS sandbox is a test FAILURE, not a skip: a
          # `describe.skipIf` would delete the tests covering the isolation
          # boundary under a green check.
          VX_REQUIRE_SANDBOX: '1'
          # The reftable rows need git 2.45; an older one fails them here
          # instead of skipping.
          VX_REQUIRE_REFTABLE: '1'
          # The API-break law needs the last v* tag; agents check out the
          # full history.
          VX_REQUIRE_TAGS: '1'
          # A PR's title and its commits are held to Conventional Commits
          # (tests/conventional-commits.unsafe.test.ts); a push passes none.
          VX_PR_TITLE: ${{ github.event.pull_request.title }}
          VX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          VX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # The `armWatcher` rows prove the NATIVE watcher delivers; where it
          # does not, `vx watch` silently polls. A runner that drops the
          # events must fail, not skip.
          VX_REQUIRE_WATCH_EVENTS: '1'
          # Root bypasses every permission bit, so six rows asserting what
          # one does would skip on a root container (item 481).
          VX_REQUIRE_NONROOT: '1'
          # The 2 MiB tmpfs each Linux agent mounts (vx-agent.yml) for
          # `tests/disk-full.unsafe.test.ts`.
          VX_SMALL_DISK: /tmp/vx-small
        run: |
          # The summary is written by a PLUGIN, and a plugin that declines
          # writes nothing under a green check, so assert it in this step
          # (`$GITHUB_STEP_SUMMARY` is per step); vx's exit code stays the gate.
          set +e
          bun packages/vx/src/bin.ts run ci check.vs-turbo build.bun.linux-arm64 build.bun.darwin-arm64 --all
          code=$?
          set -e
          test -s "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is empty — did @vzn/vx-ci decline?"; exit 1; }
          grep -q 'vx run' "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is not the vx one"; exit 1; }
          exit $code

      # A killed vx never closes its run: cancel the agent runs it
      # dispatched (github() lists them in RUNNER_TEMP), or queued ones
      # hold runners the next run waits for. A second cancel answers 409.
      - if: always()
        name: Cancel the run's agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/vx-dte-runs"
          [ -f "$f" ] || exit 0
          while read -r r; do gh api -X POST "$r/cancel" > /dev/null 2>&1 || true; done < "$f"

      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}

  # The linux run above runs every package's suite through `vx run ci --all`;
  # this job exists for the one suite that needs live services — the REAPI
  # wire against a real cache server and a real execution worker.
  #
  # bazel-remote is a real REAPI server (a single static binary, hence a cheap
  # service container). VX_REQUIRE_REAPI turns an absent endpoint into a
  # FAILURE rather than a skip, for the same reason VX_REQUIRE_SANDBOX exists:
  # the round-trip suite is the only thing proving the wire works, and a skip
  # reports green.
  packages:
    name: plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      bazel-remote:
        image: buchgr/bazel-remote-cache:latest
        ports:
          - 19092:9092
        env:
          BAZEL_REMOTE_DIR: /data
          BAZEL_REMOTE_MAX_SIZE: 1
          BAZEL_REMOTE_GRPC_ADDRESS: 0.0.0.0:9092
          BAZEL_REMOTE_HTTP_ADDRESS: 0.0.0.0:8080

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # `@vzn/vx-reapi#test` reaches core's compile tasks through
      # `install → ^build`, and those run sandboxed; the runner action is
      # what lets them.
      - uses: ./.github/actions/vx-runner

      # NativeLink gives the EXECUTION half a real scheduler + worker. Its
      # official image is distroless — no /bin/sh — so a worker inside it
      # cannot run any REAPI Command that starts with a shell (every vx task
      # does). Rehost the same static musl binary on busybox, which has one.
      # The busybox base is the Docker Official image, taken from whichever
      # of three mirrors answers: Docker Hub's auth endpoint 500'd this step
      # on 2026-08-24, and AWS's mirror answered every attempt with
      # `429 Too Many Requests: Data limit exceeded` on 2026-09-25, so one
      # registry is one outage away from a red job that changed nothing
      # here. Two rounds over the three, 20 s apart.
      - name: Start NativeLink (execution)
        run: |
          docker create --name nl-x ghcr.io/tracemachina/nativelink:v0.6.0 /x
          docker cp -L nl-x:/bin/nativelink packages/vx-reapi/tests/helpers/nativelink-bin
          docker rm nl-x
          cd packages/vx-reapi/tests/helpers
          built=
          for round in 1 2; do
            for base in public.ecr.aws/docker/library/busybox:musl \
                        mirror.gcr.io/library/busybox:musl \
                        docker.io/library/busybox:musl; do
              printf 'FROM %s\nCOPY nativelink-bin /usr/local/bin/nativelink\nENTRYPOINT ["/usr/local/bin/nativelink"]\n' "$base" > Dockerfile.nl
              if docker build -q -f Dockerfile.nl -t vx-nativelink-sh .; then built=1; break 2; fi
              echo "docker build from $base failed (round $round)"
            done
            [ "$round" = 2 ] || sleep 20
          done
          [ -n "$built" ] || exit 1
          docker run -d --name vx-nl -p 51051:50051 \
            -v "$PWD/nativelink-exec.json5:/config.json5" vx-nativelink-sh /config.json5
          sleep 5
          docker ps --filter name=vx-nl --format '{{.Status}}' | grep -q Up

      # `@vzn/vx-reapi#test.live` runs only the files that dial a server
      # (the `ci` job runs every file, these in skip mode), uncached, with
      # the endpoints passed through. BOTH require flags are set: a skip is
      # a silent pass, and these suites are the only proof the cache wire
      # and the execution wire work.
      - name: vx run test.live (@vzn/vx-reapi)
        env:
          VX_REAPI_TEST_ENDPOINT: grpc://127.0.0.1:19092
          VX_REQUIRE_REAPI: '1'
          VX_REAPI_EXEC_ENDPOINT: grpc://127.0.0.1:51051
          VX_REQUIRE_REAPI_EXEC: '1'
        run: bun packages/vx/src/bin.ts run test.live --filter @vzn/vx-reapi

      # `@vzn/vx-migrate`'s `nx-exec` is a Node bin over Nx's own
      # `runExecutor`, and the fake-Nx suite cannot prove Nx's side of that
      # contract. A real install lives INSIDE the package (gitignored
      # `.nx-live/`), so the sandboxed `test.live` task (only the
      # `*-live.test.ts` files; `ci` runs every file) reads it under its own
      # grant; the env names it and, like the REAPI flags, makes an absent
      # install a failure. Uncached: `nx@22` is unpinned.
      - name: Install Nx for the nx-exec live suite
        run: npm install --no-audit --no-fund --prefix packages/vx-migrate/.nx-live nx@22 @nx/js@22 typescript@5
      - name: vx run test.live (@vzn/vx-migrate, nx-exec)
        env:
          VX_NX_MODULES: ${{ github.workspace }}/packages/vx-migrate/.nx-live
          VX_REQUIRE_NX: '1'
        run: bun packages/vx/src/bin.ts run test.live --filter @vzn/vx-migrate

  # The linux-arm64 release binary is cross-compiled and never run
  # elsewhere: this proves it launches, on main only, so a pull request
  # waits on no arm64 runner.
  binary-linux-arm64:
    name: compiled binary (linux-arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - uses: ./.github/actions/vx-runner

      - name: compiled binary (check.binary)
        run: bun packages/vx/src/bin.ts run check.binary --filter @vzn/vx

  # The macOS run exists because THREE macOS-only defects reached main
  # unseen on an ubuntu-only matrix (2026-08-22: bsdtar refusing --format=gnu
  # broke every cache save; the /tmp -> /private/tmp symlinked-base
  # containment refusing every restore; close() leaking a handle on
  # SQLITE_IOERR_VNODE). The platform-divergence classes it guards are tar
  # formats, filesystem/symlink semantics and SQLite behaviour — all covered
  # by the core suite with no extra services.
  #
  # VX_REQUIRE_SANDBOX, as on Linux: the sandbox suites run here whenever
  # seatbelt answers, so an unavailable one must fail, not skip quietly.
  #
  # Its own distributed run (owner, 2026-10-22: "yes 2x dte"): this job
  # dispatches macOS agents (.vx/workspace.ts picks the pool by the
  # runner's OS) and keys the suites on it (#3861). Several processes, not
  # one, is the point on macOS: `bun test` pins descriptors per imported
  # module and the process cap is 10 240.
  macos:
    name: core tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}
          restore-keys: vx-${{ runner.os }}-

      - name: A run id no one can guess
        run: echo "VX_DTE_RUN=$(uuidgen)" >> "$GITHUB_ENV"

      # The core suite, the host binary (darwin-arm64: it launches,
      # re-signed only if macOS refuses it) and the cold cross-compile
      # under seatbelt, which matches the directory Bun extracts a
      # downloaded runtime into by the grant's glob.
      - name: vx run test (core, darwin)
        env:
          VX_DTE_RELAY: https://vx-dte-relay.exelord.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
          VX_REQUIRE_SANDBOX: '1'
          VX_REQUIRE_WATCH_EVENTS: '1'
        run: bun packages/vx/src/bin.ts run test check.binary build.bun.darwin-x64 build.bun.linux-x64 --filter @vzn/vx

      # A killed vx never closes its run: cancel the agent runs it
      # dispatched (github() lists them in RUNNER_TEMP), or queued ones
      # hold runners the next run waits for. A second cancel answers 409.
      - if: always()
        name: Cancel the run's agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/vx-dte-runs"
          [ -f "$f" ] || exit 0
          while read -r r; do gh api -X POST "$r/cancel" > /dev/null 2>&1 || true; done < "$f"

      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}

      # A gate since 2026-08-25 (220/220 enforced across 11 runs): every
      # run drives 20 leaky-task executions through the real run() path on
      # this machine, and a NOT_ENFORCED one reds the job. Not distributed:
      # the canary asks this machine's seatbelt.
      - name: sandbox enforcement canary
        env:
          VX_DTE_RUN: ''
        run: bun packages/vx/tests/helpers/sandbox-canary.ts 20

      # Every package's build under seatbelt, as a Mac developer runs it: a
      # grant bwrap honoured by its mounts failed `@vzn/vx-docs#import` on
      # every Mac for a week (2026-10-17). No cache read: a hit would skip
      # the very tasks this runs, and a run with no cache is not one to
      # spread over agents.
      - name: vx run build --all (seatbelt)
        env:
          VX_DTE_RUN: ''
        run: bun packages/vx/src/bin.ts run build --all '--cache-policy=local:,remote:'
