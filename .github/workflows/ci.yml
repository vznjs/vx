name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dogfood: vx orchestrates its own format-check / lint / test
      # via vx.config.ts. The `ci` task is a group that fans out to
      # all three. Bun's `run` script wrapper prepends node_modules/.bin
      # to PATH, so oxlint / oxfmt resolve.
      - name: vx run ci
        run: bun run ci
