name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red.
  workflow_dispatch:

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sandbox runtime deps: bubblewrap (kernel-level isolation) +
      # socat (network bridge) on Linux, plus strace (per-task
      # violation detection). Ubuntu 24's default AppArmor profile
      # blocks unprivileged user namespaces — that breaks bwrap. We
      # disable the restriction via sysctl so the sandbox tests can
      # actually exercise bwrap end-to-end in CI.
      - name: Install sandbox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat strace ripgrep
          # Ubuntu 24+ ships with AppArmor restricting unprivileged
          # user namespaces. bwrap needs them; without this sysctl
          # tweak it exits non-zero on first use.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # AppArmor profile-based restriction (Ubuntu 24.04+): some
          # builds also enforce via the unprivileged_userns profile.
          if [ -f /etc/apparmor.d/unprivileged_userns ]; then
            sudo aa-disable /etc/apparmor.d/unprivileged_userns || true
          fi

      # Diagnose: confirm bwrap actually runs on this host before
      # firing the test suite. Surfaces install / namespace issues
      # directly in CI logs instead of as opaque "tests skipped".
      - name: Diagnose sandbox availability
        run: |
          echo "::group::which bwrap"
          which bwrap || echo "MISSING"
          bwrap --version || true
          echo "::endgroup::"
          echo "::group::sysctl userns"
          sysctl kernel.unprivileged_userns_clone 2>&1 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          echo "::endgroup::"
          echo "::group::bwrap minimal exec"
          bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
          echo "ok: bwrap exited 0"
          echo "::endgroup::"
          echo "::group::probeSandbox()"
          bun -e 'import("/home/runner/work/vx/vx/src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => console.log(JSON.stringify(a)))' \
            || bun -e 'import("./src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => console.log(JSON.stringify(a)))'
          echo "::endgroup::"

      # Dogfood: vx orchestrates its own gate via vx.config.ts. The `ci`
      # task is a group fanning out to `lint` (→ lint.oxlint +
      # lint.oxfmt) and `test`. The release binaries are built separately
      # in release.yml (`vx run build`) — cross-compiling all four here
      # alongside lint+test starves the runner. vx prepends each
      # project's node_modules/.bin to PATH per task, so oxlint / oxfmt
      # resolve from a raw shell.
      #
      # `--report-file` appends the per-task result table to the job summary,
      # so a red run says WHICH task failed on the PR page instead of only in
      # the log. Dogfooding it here is deliberate: the flag exists because the
      # documented `--report=markdown >> "$GITHUB_STEP_SUMMARY"` recipe wrote
      # the entire run log into the summary, and nothing caught that for
      # months because this repo never ran its own recipe.
      #
      # No `if: always()` needed: vx writes the report itself before exiting,
      # so a FAILING run — the case this is for — still lands its table, and
      # the step's exit code still gates the job.
      #
      # VX_REQUIRE_SANDBOX turns an unavailable OS sandbox into a test FAILURE
      # instead of a skip. The step above installs bwrap + socat + strace, so
      # unavailable here means the install broke — and `describe.skipIf` would
      # otherwise delete 21 tests covering the isolation boundary and the
      # `--verify=inputs` proof under a green check. The diagnose step is not a
      # substitute: it hard-fails on the raw bwrap exec, one of probeSandbox's
      # four failure paths. `vx run` isolates the child env, so this is
      # forwarded via the test task's exec.env.passThrough.
      - name: vx run ci
        env:
          VX_REQUIRE_SANDBOX: '1'
        run: bun src/bin.ts run ci --report-file="$GITHUB_STEP_SUMMARY"

  cloud:
    name: vx-cloud tests (postgres)
    runs-on: ubuntu-latest
    # 25, not 15. This job's install chain is long before a single test runs:
    # apt-get postgres, bun install, npm playwright, `--with-deps` apt fonts,
    # the chromium download, and the SPA build. At 15 there was no headroom for
    # a slow apt mirror, and on 2026-08-19 that cancelled a run outright —
    # `fonts-freefont-ttf` (5.6 MB) alone took 7m49s from
    # azure.archive.ubuntu.com and the budget expired mid-download, before any
    # test body executed.
    #
    # Raising it is right HERE for the reason it is usually wrong: this failure
    # mode is running LONG, which more time genuinely fixes. A job that HANGS
    # is still caught — 25 is well under the point where a wedged suite would
    # sit unnoticed, and the suite itself is ~2 minutes.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The @vzn/vx-cloud suite runs against a REAL Postgres: the
      # ephemeral-pg helper (packages/cloud/tests/helpers/ephemeral-pg.ts)
      # boots its own cluster per test process via initdb + a unix socket
      # (no port, trust auth), so it just needs the Postgres server binaries
      # (initdb / pg_ctl / pg_config) on disk. S3 is faked in-process — no
      # real bucket. Non-root runners take the helper's direct path.
      - name: Install Postgres server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          # Confirm the helper can find the server binaries.
          pg_config --bindir || ls -d /usr/lib/postgresql/*/bin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The dashboard's BEHAVIOUR (routing, workspace scoping, the server-side
      # search round-trip) is asserted by driving the real SPA in a real
      # Chromium. Those suites used to skip here for want of a browser — and a
      # skip is a silent pass, so dashboard regressions could only ever be
      # caught by someone running the suite locally.
      #
      # playwright is deliberately NOT a repo dependency (it pulls browser
      # downloads into every `bun install`), so it is installed globally here;
      # /usr/local/lib/node_modules is already one of the gate's resolution
      # roots. `--with-deps` brings the shared libraries headless Chromium needs
      # on a bare runner.
      - name: Install playwright + chromium
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      # The browser suites serve the BUILT SPA, not the source.
      - name: Build the dashboard
        run: bun src/bin.ts run build.ui

      - name: bun test (packages/cloud)
        # --timeout 30000: the pg-backed suites boot a real Postgres cluster in
        # their first beforeAll; on a contended runner that boot can exceed
        # bun's default 5s hook timeout, killing initdb mid-run ("caught
        # signal") and cascading failures into every pg suite. The CLI flag is
        # the mechanism that verifiably raises the HOOK timeout (bunfig's
        # [test] timeout is not honored for hooks on current Bun).
        #
        # VX_REQUIRE_BROWSER turns an absent browser into a FAILURE instead of
        # a skip, for the same reason VX_REQUIRE_SANDBOX exists in the job
        # above: the two steps before this one provision playwright and the
        # dist, so unavailable here means the provisioning broke — and a
        # `describe.skipIf` would delete the suites under a green check.
        #
        # It applies only to the suites declared `'required'`. `visual`
        # (pixel-exact baselines captured in a container) and `ui-perf`
        # (wall-clock fps) are host-pinned and skip in CI by design, each
        # saying so in its own gate call rather than being quietly absent.
        env:
          VX_REQUIRE_BROWSER: '1'
        run: cd packages/cloud && bun test --timeout 30000
