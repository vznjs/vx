name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint + typecheck
        run: bun run lint

      - name: Test
        run: bun test
