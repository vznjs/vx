name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red.
  workflow_dispatch:

# A newer push to the same ref supersedes an older run. On a PR the running
# one is cancelled: its old head is never merged. On main it finishes and
# only the queued runs between it and the tip are dropped, or a busy main
# never completes a run, never releases (auto-release.yml) and never says
# it is red.
# Checkout is all the token does here: a PR's code runs in these jobs, and
# a default token may hold write access (L-29).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Every tag and the history since: the API-break law
        # (tests/api-break.unsafe.test.ts) reads the last release's record
        # and the commits after it.
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/vx-runner

      # Dogfood: vx orchestrates its own gate via vx.config.ts. Core's
      # `ci` task is a group fanning out to `lint` (→ lint.oxlint +
      # lint.oxfmt), `test` and `check.binary` (the host binary, compiled
      # the way release.yml does, must launch and report the manifest
      # version — a layout move broke that stamp unseen for a week once).
      # The four release targets are `build.bun`, built only by
      # release.yml: core has no `build`, so no dependant's `install →
      # ^build` compiles them, here or on a laptop. vx prepends each
      # project's node_modules/.bin to PATH per task, so oxlint / oxfmt
      # resolve from a raw shell.
      #
      # The job summary comes from `@vzn/vx-ci`, declared in
      # vx.workspace.ts — it activates on GITHUB_STEP_SUMMARY and writes the
      # verdict, stats, failures and the per-task table, so a red run says
      # WHICH task failed on the PR page instead of only in the log.
      #
      # `--report-file="$GITHUB_STEP_SUMMARY"` used to be passed here and was
      # REMOVED when the plugin landed: both write the same file, so the page
      # carried two tables. The plugin is the surface now; core's
      # `--report=markdown` / `--report-file` remain for workspaces that want
      # the table without declaring a plugin. Neither needs `if: always()` —
      # vx writes before exiting, so a FAILING run still lands its summary and
      # the step's exit code still gates the job.
      #
      # VX_REQUIRE_SANDBOX turns an unavailable OS sandbox into a test FAILURE
      # instead of a skip. The runner action installs bwrap + socat + strace, so
      # unavailable here means the install broke — and `describe.skipIf` would
      # otherwise delete the tests covering the isolation boundary under a
      # green check. The diagnose step is not a
      # substitute: it hard-fails on the raw bwrap exec, one of probeSandbox's
      # four failure paths. `vx run` isolates the child env, so this is
      # forwarded via the test task's exec.env.passThrough.
      # Everything the gate checks is a vx task — the site's generated
      # collection (`@vzn/vx-docs#import`), the site-vs-results check
      # (`@vzn/vx-bench#check.site`), every package's suite (each
      # package's `ci` → `test`) — so the same command is the gate here
      # and on a laptop. A read across a project boundary is declared on
      # the task that needs it, never worked around with a workspace step.
      # A 2 MiB tmpfs for `tests/disk-full.unsafe.test.ts`: the suite skips
      # without VX_SMALL_DISK, so a laptop is not asked to mount anything and
      # the machine whose result gates a merge runs it. It is in the unsafe
      # set because a sandboxed shard sees a mount it did not make as
      # read-only (EROFS, the first run), and a disk that cannot be written
      # cannot be filled.
      # vx's own cache, carried between runs: a run restores the newest
      # one main saved and replays every task whose key is unchanged, so a
      # PR re-runs only what it touched (owner, 2026-10-04: cache all that
      # can be). Only a push to main saves, so a PR's code never writes an
      # entry another run reads.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The workspace's index and the user store its entries live in.
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}
          restore-keys: vx-${{ runner.os }}-

      - name: Mount a small disk
        run: |
          sudo mkdir -p /tmp/vx-small
          sudo mount -t tmpfs -o size=2m tmpfs /tmp/vx-small
          sudo chown "$USER" /tmp/vx-small
      - name: vx run ci
        env:
          VX_REQUIRE_SANDBOX: '1'
          # The reftable rows (core's git-reftable.unsafe.test.ts, vx-migrate's
          # head-stamp-reftable.test.ts) need git 2.45; the runner's git is
          # newer, and an older one fails them here instead of skipping.
          VX_REQUIRE_REFTABLE: '1'
          # The API-break law needs the last v* tag (full history above);
          # without one it fails here instead of passing.
          VX_REQUIRE_TAGS: '1'
          # A PR's title and its commits are held to Conventional Commits
          # (tests/conventional-commits.unsafe.test.ts); a push passes none.
          VX_PR_TITLE: ${{ github.event.pull_request.title }}
          VX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          VX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # Same reason as the sandbox flag: the two `armWatcher` rows prove
          # the NATIVE watcher delivers, and where it does not `vx watch`
          # silently falls back to polling. Bun 1.3.11 on the cloud container
          # drops hidden-file fs.watch events, so the probe never lands there
          # and the rows skip; a runner that starts doing the same must be a
          # failure, not a quiet skip.
          VX_REQUIRE_WATCH_EVENTS: '1'
          # Same reason again: six rows across five suites assert what a
          # PERMISSION BIT does, and root bypasses every permission bit, so
          # each one carried a bare `skipIf(getuid() === 0)` and a comment
          # claiming this runner is not root. Nothing checked that claim, and
          # a root container deletes all six under a green check (item 481
          # found it that way). This makes root the failure it should be here.
          VX_REQUIRE_NONROOT: '1'
          VX_SMALL_DISK: /tmp/vx-small
        run: |
          # The summary is written by a PLUGIN now, and a plugin that declines
          # writes nothing — a silent regression, since job summaries are not
          # exposed through the REST API and a green check looks identical
          # either way. So assert it, IN THIS STEP: `$GITHUB_STEP_SUMMARY` is
          # per-STEP (the runner hands each one its own file and concatenates
          # them), which a separate verification step learned the hard way by
          # testing its own empty file and failing every time.
          #
          # vx's exit code stays the gate: it is captured, the summary is
          # checked either way — a FAILING run is when the summary matters
          # most, since it carries the failure callout — and then re-raised.
          set +e
          bun packages/vx/src/bin.ts run ci --all
          code=$?
          set -e
          test -s "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is empty — did @vzn/vx-ci decline?"; exit 1; }
          grep -q 'vx run' "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is not the vx one"; exit 1; }
          exit $code

      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The workspace's index and the user store its entries live in.
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}

      # A cross-compile on a cold Bun cache, in bwrap: nothing warms
      # `~/.bun/install/cache`, so each target's runtime downloads from npm
      # inside the sandbox, as it does on a fresh laptop — what the
      # `build.bun.*` grants exist for (2026-09-29). Two targets the host
      # is not; release.yml builds all four the same way.
      - name: Cross-compile on a cold Bun cache (bwrap)
        run: |
          if ls ~/.bun/install/cache/bun-*-v* 2>/dev/null; then echo "::error::the Bun cache is not cold"; exit 1; fi
          bun packages/vx/src/bin.ts run build.bun.linux-arm64 build.bun.darwin-arm64 --filter @vzn/vx --concurrency 2

  # The `ci` job above runs every package's suite through `vx run ci --all`;
  # this job exists for the one suite that needs live services — the REAPI
  # wire against a real cache server and a real execution worker.
  #
  # bazel-remote is a real REAPI server (a single static binary, hence a cheap
  # service container). VX_REQUIRE_REAPI turns an absent endpoint into a
  # FAILURE rather than a skip, for the same reason VX_REQUIRE_SANDBOX exists:
  # the round-trip suite is the only thing proving the wire works, and a skip
  # reports green.
  packages:
    name: plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      bazel-remote:
        image: buchgr/bazel-remote-cache:latest
        ports:
          - 19092:9092
        env:
          BAZEL_REMOTE_DIR: /data
          BAZEL_REMOTE_MAX_SIZE: 1
          BAZEL_REMOTE_GRPC_ADDRESS: 0.0.0.0:9092
          BAZEL_REMOTE_HTTP_ADDRESS: 0.0.0.0:8080

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # `@vzn/vx-reapi#test` reaches core's compile tasks through
      # `install → ^build`, and those run sandboxed; the runner action is
      # what lets them.
      - uses: ./.github/actions/vx-runner

      # NativeLink gives the EXECUTION half a real scheduler + worker. Its
      # official image is distroless — no /bin/sh — so a worker inside it
      # cannot run any REAPI Command that starts with a shell (every vx task
      # does). Rehost the same static musl binary on busybox, which has one.
      # The busybox base is the Docker Official image, taken from whichever
      # of three mirrors answers: Docker Hub's auth endpoint 500'd this step
      # on 2026-08-24, and AWS's mirror answered every attempt with
      # `429 Too Many Requests: Data limit exceeded` on 2026-09-25, so one
      # registry is one outage away from a red job that changed nothing
      # here. Two rounds over the three, 20 s apart.
      - name: Start NativeLink (execution)
        run: |
          docker create --name nl-x ghcr.io/tracemachina/nativelink:v0.6.0 /x
          docker cp -L nl-x:/bin/nativelink packages/vx-reapi/tests/helpers/nativelink-bin
          docker rm nl-x
          cd packages/vx-reapi/tests/helpers
          built=
          for round in 1 2; do
            for base in public.ecr.aws/docker/library/busybox:musl \
                        mirror.gcr.io/library/busybox:musl \
                        docker.io/library/busybox:musl; do
              printf 'FROM %s\nCOPY nativelink-bin /usr/local/bin/nativelink\nENTRYPOINT ["/usr/local/bin/nativelink"]\n' "$base" > Dockerfile.nl
              if docker build -q -f Dockerfile.nl -t vx-nativelink-sh .; then built=1; break 2; fi
              echo "docker build from $base failed (round $round)"
            done
            [ "$round" = 2 ] || sleep 20
          done
          [ -n "$built" ] || exit 1
          docker run -d --name vx-nl -p 51051:50051 \
            -v "$PWD/nativelink-exec.json5:/config.json5" vx-nativelink-sh /config.json5
          sleep 5
          docker ps --filter name=vx-nl --format '{{.Status}}' | grep -q Up

      # The suite is `@vzn/vx-reapi#test`, one bun process per file (the
      # task's own comment says why), run through vx with the endpoints in
      # its environment; the task passes them through and folds them into
      # its key, so this live-mode run never hits the plain gate's skip-mode
      # entry. BOTH require flags are set: a skip is a silent pass, and
      # these suites are the only proof the cache wire and the execution
      # wire work.
      - name: vx run test (@vzn/vx-reapi, live)
        env:
          VX_REAPI_TEST_ENDPOINT: 127.0.0.1:19092
          VX_REQUIRE_REAPI: '1'
          VX_REAPI_EXEC_ENDPOINT: 127.0.0.1:51051
          VX_REQUIRE_REAPI_EXEC: '1'
        run: bun packages/vx/src/bin.ts run test --filter @vzn/vx-reapi

      # `@vzn/vx-migrate`'s `nx-exec` is a Node bin over Nx's own
      # `runExecutor`, and the fake-Nx suite cannot prove Nx's side of that
      # contract. A real install lives INSIDE the package (gitignored
      # `.nx-live/`), so the sandboxed `test` task reads it under its own
      # grant; the env names it and, like the REAPI flags, makes an absent
      # install a failure. The task folds both variables into its key, so
      # this live run never lands on the plain gate's skip-mode entry.
      - name: Install Nx for the nx-exec live suite
        run: npm install --no-audit --no-fund --prefix packages/vx-migrate/.nx-live nx@22 @nx/js@22 typescript@5
      - name: vx run test (@vzn/vx-migrate, live nx-exec)
        env:
          VX_NX_MODULES: ${{ github.workspace }}/packages/vx-migrate/.nx-live
          VX_REQUIRE_NX: '1'
        run: bun packages/vx/src/bin.ts run test --filter @vzn/vx-migrate

  # The darwin job exists because THREE macOS-only defects reached main
  # unseen on an ubuntu-only matrix (2026-08-22: bsdtar refusing --format=gnu
  # broke every cache save; the /tmp -> /private/tmp symlinked-base
  # containment refusing every restore; close() leaking a handle on
  # SQLITE_IOERR_VNODE). The platform-divergence classes it guards are tar
  # formats, filesystem/symlink semantics and SQLite behaviour — all covered
  # by the core suite with no extra services.
  #
  # Deliberately NO VX_REQUIRE_SANDBOX here: the macOS sandbox suites are a
  # recorded load-flaky class (sandbox-exec under concurrent load — see the
  # decision log, 2026-08-23), and the sandbox SECURITY boundary is already
  # ENFORCED by the linux job above. Here an unavailable sandbox skips, so
  # this job cannot import that flake into main; if the sandbox tests prove
  # stable on these runners over time, the flag can be promoted.
  core-darwin:
    name: core tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # vx's cache between runs, as in the linux job.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The workspace's index and the user store its entries live in.
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}
          restore-keys: vx-${{ runner.os }}-

      # The core suite through vx, as on Linux: the twelve shard tasks plus
      # the unsafe suite, dealt by weight, run side by side under the
      # scheduler's cap. Several processes, not one, is the point on macOS:
      # `bun test` pins descriptors per imported module and the process
      # cap is 10 240, which the whole suite in one process does not clear.
      # No VX_REQUIRE_SANDBOX here (see the job comment), so the sandbox
      # suites skip; the canary below is what watches enforcement.
      - name: vx run test (core, darwin)
        env:
          # FSEvents delivers the watch probe here; the rows must not vanish
          # quietly if that changes (see the linux job for the reasoning).
          VX_REQUIRE_WATCH_EVENTS: '1'
        run: bun packages/vx/src/bin.ts run test --filter @vzn/vx

      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The workspace's index and the user store its entries live in.
          path: |
            .vx/cache
            ~/.vx
          key: vx-${{ runner.os }}-${{ github.sha }}

      # DATA COLLECTION, not a gate: the sandbox suites are class-gated on
      # darwin CI because sandbox-exec misbehaves under load here — including
      # one observed NON-ENFORCEMENT (an undeclared read succeeding). That
      # every darwin run drives 20 leaky-task executions through the REAL
      # run() path and prints a greppable [canary] SUMMARY line. Promoted
      # from data-only to a GATE 2026-08-25 (220/220 enforced across 11
      # runs): a NOT_ENFORCED iteration reds the job; reporting loss stays
      # tolerated (lossy-by-OS, ~5%, asserted on nowhere here).
      - name: sandbox enforcement canary
        run: bun packages/vx/tests/helpers/sandbox-canary.ts 20

      # The linux job's cold cross-compile, under seatbelt: Bun extracts a
      # downloaded runtime into the package directory before moving it into
      # its cache, and seatbelt matches that directory by the grant's glob.
      - name: Cross-compile on a cold Bun cache (seatbelt)
        run: |
          if ls ~/.bun/install/cache/bun-*-v* 2>/dev/null; then echo "::error::the Bun cache is not cold"; exit 1; fi
          bun packages/vx/src/bin.ts run build.bun.darwin-x64 build.bun.linux-x64 --filter @vzn/vx --concurrency 2

      # The host binary (darwin-arm64), compiled as release.yml compiles it:
      # it launches (re-signed only if macOS refuses it), reports the
      # manifest version, runs its config worker, keeps a workspace .env
      # out, resolves a package's main and exports, and runs a
      # bare-specifier workspace with a plugin package. The linux job runs
      # the same task for linux-x64 inside `vx run ci`.
      - name: compiled binary (check.binary)
        run: bun packages/vx/src/bin.ts run check.binary --filter @vzn/vx
