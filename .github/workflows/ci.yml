name: CI

on:
  push:
    branches: [main]
  # `closed`: a merged or closed PR's own run joins its concurrency group
  # and cancels the one still running, so its workers free their runners
  # (2026-10-23: workers queued 108-184 s behind merged PRs' runs). Its jobs
  # are skipped.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # The merge queue tests each group's merge before main moves.
  merge_group:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red. `cold` reads no cache,
  # so every task runs: how DTE packs a full run, measured on demand.
  workflow_dispatch:
    inputs:
      cold:
        description: Read no cache; every task runs
        type: boolean
        default: false

# Checkout is all the token does here: a PR's code runs in these jobs, and
# a default token may hold write access (L-29).
permissions:
  contents: read
  # The remote cache's token: turboCache({ oidc }) exchanges the job's OIDC
  # token with Vercel, no long-lived secret (.vx/workspace.ts).
  id-token: write

# A newer push to the same PR supersedes an older run, which is cancelled:
# its old head is never merged. Any other run (main, a dispatch) finishes
# and only the queued runs between it and the tip are dropped, or a busy
# main never completes a run, never releases (auto-release.yml) and never
# says it is red.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A stack's top pull request holds every layer below it, and merging it
# merges them all: only it runs CI, so a stack costs one run, not one per
# layer (owner, 2026-10-22). Off a stack both sides are null and it runs.
jobs:
  # One distributed run (@vzn/vx-dte, .vx/workspace.ts) for every platform
  # (owner, 2026-10-23): a task bound to one (exec.platforms) runs on a
  # worker of it, started only when the graph has one. It checks out, installs Bun and the deps, checks the lock and runs vx,
  # as any repo would (owner, 2026-10-23: "super simple, same as devs
  # would add it"). vx names the run, plans it, starts as many workers
  # (vx-worker.yml) as the plan's width needs, cancels them at the end and
  # reads the remote cache; @vzn/vx-ci writes the job summary.
  linux:
    name: VX DTE
    if: github.event.action != 'closed' && github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A push to main deploys the docs site the run built.
    environment: ${{ github.event_name == 'push' && 'github-pages' || '' }}
    permissions:
      id-token: write
      # Dispatching and cancelling the workers.
      actions: write
      pages: write
      # release.sync gives each GitHub release its post's body.
      contents: write
    env:
      VX_DTE_RELAY: https://vx-dte-relay.exelord.workers.dev
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # An unavailable OS sandbox, reftable, tag history, native watcher
      # or non-root user fails its rows instead of skipping them.
      VX_REQUIRE_SANDBOX: '1'
      VX_REQUIRE_REFTABLE: '1'
      VX_REQUIRE_TAGS: '1'
      VX_REQUIRE_WATCH_EVENTS: '1'
      VX_REQUIRE_NONROOT: '1'
      # A PR's title and commits are held to Conventional Commits.
      VX_PR_TITLE: ${{ github.event.pull_request.title }}
      VX_PR_BASE: ${{ github.event.pull_request.base.sha }}
      VX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      # The 2 MiB tmpfs each Linux worker mounts (vx-worker.yml).
      # Cold reads nothing but still writes: workers hand outputs back
      # through the remote.
      VX_CACHE_POLICY: ${{ inputs.cold && 'local:w,remote:w' || '' }}
    steps:
      # The default branch's history: schedule-history reads the
      # merge-base's timings to pack workers. Commits and trees only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun packages/vx/src/bin.ts lock --check
      # Plans the graph, starts the workers its width needs, then
      # orchestrates them. A PR runs what its diff affects, inputs outside
      # a project included (owner, 2026-10-23); main runs everything.
      # Main also proves each release binary launches on its platform and
      # runs the files whose outcome is the platform's on Mac workers
      # (macOS-only defects reached main unseen on Linux, 2026-08-22).
      - run: bun packages/vx/src/bin.ts run ci test.live check.vs-turbo build.bun.linux-arm64 build.bun.darwin-arm64 ${{ github.event_name != 'pull_request' && 'build.bun.linux-x64 build.bun.darwin-x64 check.binary.linux-arm64 check.binary.darwin-arm64 test.platform check.sandbox-canary check.build-cold' || '' }} ${{ github.event_name == 'push' && 'release.sync' || '' }} ${{ github.event_name == 'pull_request' && '--affected' || '--all' }}
      - if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: private/vx-docs/dist
      - if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
