name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dogfood: vx orchestrates its own format-check / lint / test
      # via vx.config.ts. The `ci` task is a group that fans out to all
      # three. vx itself prepends each project's node_modules/.bin to
      # PATH per task, so oxlint / oxfmt resolve from a raw shell.
      - name: vx run ci
        run: bun src/bin.ts run ci
