name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red.
  workflow_dispatch:

jobs:
  ci:
    name: lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Show versions
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sandbox runtime deps: bubblewrap (kernel-level isolation) +
      # socat (network bridge) on Linux, plus strace (per-task
      # violation detection). Ubuntu 24's default AppArmor profile
      # blocks unprivileged user namespaces — that breaks bwrap. We
      # disable the restriction via sysctl so the sandbox tests can
      # actually exercise bwrap end-to-end in CI.
      - name: Install sandbox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat strace ripgrep
          # Ubuntu 24+ ships with AppArmor restricting unprivileged
          # user namespaces. bwrap needs them; without this sysctl
          # tweak it exits non-zero on first use.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # AppArmor profile-based restriction (Ubuntu 24.04+): some
          # builds also enforce via the unprivileged_userns profile.
          if [ -f /etc/apparmor.d/unprivileged_userns ]; then
            sudo aa-disable /etc/apparmor.d/unprivileged_userns || true
          fi

      # Diagnose: confirm bwrap actually runs on this host before
      # firing the test suite. Surfaces install / namespace issues
      # directly in CI logs instead of as opaque "tests skipped".
      - name: Diagnose sandbox availability
        run: |
          echo "::group::which bwrap"
          which bwrap || echo "MISSING"
          bwrap --version || true
          echo "::endgroup::"
          echo "::group::sysctl userns"
          sysctl kernel.unprivileged_userns_clone 2>&1 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          echo "::endgroup::"
          echo "::group::bwrap minimal exec"
          bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
          echo "ok: bwrap exited 0"
          echo "::endgroup::"
          echo "::group::probeSandbox()"
          bun -e 'import("/home/runner/work/vx/vx/packages/vx/src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => { console.log(JSON.stringify(a)); process.exit(0) })' \
            || bun -e 'import("./packages/vx/src/exec/sandbox-runtime.js").then(m => m.probeSandbox()).then(a => { console.log(JSON.stringify(a)); process.exit(0) })'
          echo "::endgroup::"

      # Dogfood: vx orchestrates its own gate via vx.config.ts. The `ci`
      # task is a group fanning out to `lint` (→ lint.oxlint +
      # lint.oxfmt) and `test`. The release binaries are built separately
      # in release.yml (`vx run build`) — cross-compiling all four here
      # alongside lint+test starves the runner. vx prepends each
      # project's node_modules/.bin to PATH per task, so oxlint / oxfmt
      # resolve from a raw shell.
      #
      # The job summary comes from `@vzn/vx-github`, declared in
      # vx.workspace.ts — it activates on GITHUB_STEP_SUMMARY and writes the
      # verdict, stats, failures and the per-task table, so a red run says
      # WHICH task failed on the PR page instead of only in the log.
      #
      # `--report-file="$GITHUB_STEP_SUMMARY"` used to be passed here and was
      # REMOVED when the plugin landed: both write the same file, so the page
      # carried two tables. The plugin is the surface now; core's
      # `--report=markdown` / `--report-file` remain for workspaces that want
      # the table without declaring a plugin. Neither needs `if: always()` —
      # vx writes before exiting, so a FAILING run still lands its summary and
      # the step's exit code still gates the job.
      #
      # VX_REQUIRE_SANDBOX turns an unavailable OS sandbox into a test FAILURE
      # instead of a skip. The step above installs bwrap + socat + strace, so
      # unavailable here means the install broke — and `describe.skipIf` would
      # otherwise delete 21 tests covering the isolation boundary and the
      # `--verify=inputs` proof under a green check. The diagnose step is not a
      # substitute: it hard-fails on the raw bwrap exec, one of probeSandbox's
      # four failure paths. `vx run` isolates the child env, so this is
      # forwarded via the test task's exec.env.passThrough.
      - name: vx run ci
        env:
          VX_REQUIRE_SANDBOX: '1'
        run: |
          # The summary is written by a PLUGIN now, and a plugin that declines
          # writes nothing — a silent regression, since job summaries are not
          # exposed through the REST API and a green check looks identical
          # either way. So assert it, IN THIS STEP: `$GITHUB_STEP_SUMMARY` is
          # per-STEP (the runner hands each one its own file and concatenates
          # them), which a separate verification step learned the hard way by
          # testing its own empty file and failing every time.
          #
          # vx's exit code stays the gate: it is captured, the summary is
          # checked either way — a FAILING run is when the summary matters
          # most, since it carries the failure callout — and then re-raised.
          set +e
          bun packages/vx/src/bin.ts run ci --all
          code=$?
          set -e
          test -s "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is empty — did @vzn/vx-github decline?"; exit 1; }
          grep -q 'vx run' "$GITHUB_STEP_SUMMARY" || { echo "::error::job summary is not the vx one"; exit 1; }
          exit $code

      # The gate above compiles the four binaries. The one this runner can
      # execute must report the version packages/vx/package.json carries —
      # the manifest src/version.ts inlines and the release workflows stamp.
      # Asserting it on every push means a layout move cannot break the
      # stamp unseen again (it did, 2026-08-26 → 2026-09-03).
      - name: compiled binary reports the manifest version
        run: |
          WANT="vx $(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$GITHUB_WORKSPACE/packages/vx/package.json")"
          GOT="$(packages/vx/dist/vx-linux-x64 --version)"
          test "$GOT" = "$WANT" || { echo "::error::binary reports '$GOT', expected '$WANT'"; exit 1; }

  # The `ci` job above is scoped to ./tests (core). Workspace-member tests ran
  # only inside the removed cloud job, so `packages/*/tests/` has been
  # unguarded since — this job is what makes a plugin's suite gate a push.
  #
  # bazel-remote is a real REAPI server (a single static binary, hence a cheap
  # service container). VX_REQUIRE_REAPI turns an absent endpoint into a
  # FAILURE rather than a skip, for the same reason VX_REQUIRE_SANDBOX exists:
  # the round-trip suite is the only thing proving the wire works, and a skip
  # reports green.
  packages:
    name: plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      bazel-remote:
        image: buchgr/bazel-remote-cache:latest
        ports:
          - 19092:9092
        env:
          BAZEL_REMOTE_DIR: /data
          BAZEL_REMOTE_MAX_SIZE: 1
          BAZEL_REMOTE_GRPC_ADDRESS: 0.0.0.0:9092
          BAZEL_REMOTE_HTTP_ADDRESS: 0.0.0.0:8080

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: bun test (packages/vx-otel)
        run: cd packages/vx-otel && bun test
      - name: bun test (packages/vx-github)
        run: cd packages/vx-github && bun test
      - name: bun test (packages/vx-mcp)
        run: cd packages/vx-mcp && bun test
      - name: bun test (packages/vx-turbo-cache)
        run: cd packages/vx-turbo-cache && bun test
      - name: bun test (packages/vx-nx-cache)
        run: cd packages/vx-nx-cache && bun test

      # NativeLink gives the EXECUTION half a real scheduler + worker. Its
      # official image is distroless — no /bin/sh — so a worker inside it
      # cannot run any REAPI Command that starts with a shell (every vx task
      # does). Rehost the same static musl binary on busybox, which has one.
      # The busybox base comes from AWS's mirror of the Docker Official
      # Images, not docker.io: Docker Hub's auth endpoint 500'd this step on
      # 2026-08-24 and unauthenticated Hub pulls from shared runners also
      # rate-limit. The build retries anyway — a registry blip must not red
      # a push that changed nothing here.
      - name: Start NativeLink (execution)
        run: |
          docker create --name nl-x ghcr.io/tracemachina/nativelink:v0.6.0 /x
          docker cp -L nl-x:/bin/nativelink packages/vx-reapi/tests/helpers/nativelink-bin
          docker rm nl-x
          cd packages/vx-reapi/tests/helpers
          printf 'FROM public.ecr.aws/docker/library/busybox:musl\nCOPY nativelink-bin /usr/local/bin/nativelink\nENTRYPOINT ["/usr/local/bin/nativelink"]\n' > Dockerfile.nl
          for attempt in 1 2 3; do
            docker build -q -f Dockerfile.nl -t vx-nativelink-sh . && break
            echo "docker build attempt $attempt failed; retrying in 20s"
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          docker run -d --name vx-nl -p 51051:50051 \
            -v "$PWD/nativelink-exec.json5:/config.json5" vx-nativelink-sh /config.json5
          sleep 5
          docker ps --filter name=vx-nl --format '{{.Status}}' | grep -q Up

      # ONE bun PROCESS PER TEST FILE, not one for the suite. Bun 1.4.0's
      # node:http2 client stalls inbound frames under load (oven-sh/bun#39796,
      # open) and the stall compounds with accumulated gRPC sessions in a
      # single process — the whole suite in one process timed out at 90s on
      # this runner (2026-08-23) while every file passes alone, here and on an
      # emulation-slowed arm64 host. Per-file processes are the shape the
      # evidence says works; --timeout 90000 still covers a single ~28s stall.
      #
      # `bun test --isolate` (Bun 1.4) looks like the way to delete this loop
      # — fresh globalThis + closed resources per file is exactly why the loop
      # exists — and it was MEASURED against real bazel-remote + NativeLink
      # rather than assumed: six interleaved rounds, all 92 tests passing in
      # every run, stalls counted by wall clock. Plain one process 0/6, this
      # loop 1/6, --isolate 3/6, each stall a single multi-chunk ByteStream
      # test taking 30.07s (the gRPC deadline) instead of ~0.1s. Isolation
      # gives every FILE its own gRPC client and http2 session, so the suite
      # pays the session-setup race nine times instead of once. Do not
      # re-propose it without new numbers.
      #
      # BOTH require flags are set: a skip is a silent pass, and these suites
      # are the only proof the cache wire and the execution wire work.
      - name: bun test (packages/vx-reapi, per-file)
        env:
          VX_REAPI_TEST_ENDPOINT: 127.0.0.1:19092
          VX_REQUIRE_REAPI: '1'
          VX_REAPI_EXEC_ENDPOINT: 127.0.0.1:51051
          VX_REQUIRE_REAPI_EXEC: '1'
        run: |
          cd packages/vx-reapi
          for f in tests/*.test.ts; do
            echo "::group::$f"
            bun test "$f" --timeout 90000
            echo "::endgroup::"
          done

  # The darwin job exists because THREE macOS-only defects reached main
  # unseen on an ubuntu-only matrix (2026-08-22: bsdtar refusing --format=gnu
  # broke every cache save; the /tmp -> /private/tmp symlinked-base
  # containment refusing every restore; close() leaking a handle on
  # SQLITE_IOERR_VNODE). The platform-divergence classes it guards are tar
  # formats, filesystem/symlink semantics and SQLite behaviour — all covered
  # by the core suite with no extra services.
  #
  # Deliberately NO VX_REQUIRE_SANDBOX here: the macOS sandbox suites are a
  # recorded load-flaky class (sandbox-exec under concurrent load — see the
  # decision log, 2026-08-23), and the sandbox SECURITY boundary is already
  # ENFORCED by the linux job above. Here an unavailable sandbox skips, so
  # this job cannot import that flake into main; if the sandbox tests prove
  # stable on these runners over time, the flag can be promoted.
  core-darwin:
    name: core tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # The same four shards the `test.bun.shard-*` tasks run (vx.config.ts),
      # sequentially, so the two platforms execute an identical suite. Four
      # processes, not one, is the point on macOS: `bun test` pins
      # descriptors per imported module and the process cap is 10 240, which
      # the whole suite in one process does not clear.
      - name: bun test (core, darwin)
        run: |
          cd packages/vx
          for i in 1 2 3 4; do bun test --shard=$i/4 || exit 1; done

      # DATA COLLECTION, not a gate: the sandbox suites are class-gated on
      # darwin CI because sandbox-exec misbehaves under load here — including
      # one observed NON-ENFORCEMENT (an undeclared read succeeding). That
      # every darwin run drives 20 leaky-task executions through the REAL
      # run() path and prints a greppable [canary] SUMMARY line. Promoted
      # from data-only to a GATE 2026-08-25 (220/220 enforced across 11
      # runs): a NOT_ENFORCED iteration reds the job; reporting loss stays
      # tolerated (lossy-by-OS, ~5%, asserted on nowhere here).
      - name: sandbox enforcement canary
        run: bun packages/vx/tests/helpers/sandbox-canary.ts 20

      # A compiled binary must LAUNCH on macOS. Bun 1.4.0's `--compile`
      # signature is rejected by macOS (SIGKILL, exit 137) until it is
      # re-signed ad hoc — the release workflow does that on a macOS runner.
      # This pins both halves: the raw build's signature state is reported,
      # and the re-signed binary answers `--version`. If a future Bun signs
      # correctly, the first line changes and the re-sign step can go.
      - name: compiled binary launches after ad-hoc re-sign
        run: |
          cd packages/vx
          bun build --compile --target=bun-darwin-arm64 src/bin.ts --outfile /tmp/vx-ci
          codesign --verify /tmp/vx-ci && echo "bun's own signature: valid" || echo "bun's own signature: INVALID (expected on Bun 1.4.0)"
          codesign -s - --force /tmp/vx-ci
          # The binary inlines packages/vx/package.json's version; the release
          # workflows stamp that file and assert this same equality. Proving it
          # on every push means a layout move cannot silently break the stamp
          # again (it did, unseen, from 2026-08-26 to 2026-09-03).
          # This step runs from packages/vx (see the cd above), so name the
          # manifest from the workspace root — the first run of this assertion
          # went red on exactly that relative path (2026-09-03).
          WANT="vx $(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$GITHUB_WORKSPACE/packages/vx/package.json")"
          GOT="$(/tmp/vx-ci --version)"
          test "$GOT" = "$WANT" || { echo "binary reports '$GOT', expected '$WANT'"; exit 1; }

      # …and runs a workspace written the way the docs show it: bare
      # `@vzn/vx` / `@vzn/vx/plugins/*` imports resolved through node_modules.
      # A compiled Bun 1.4.0 binary ignores package.json `exports` for on-disk
      # packages and only finds `<pkg>/index.ts` (measured 2026-09-03), which
      # is why the packages ship root shims — this is the end-to-end proof
      # that a binary user's config loads.
      - name: compiled binary runs a bare-specifier workspace
        run: |
          W=$(mktemp -d)
          mkdir -p "$W/packages/a/src" "$W/node_modules/@vzn"
          ln -s "$GITHUB_WORKSPACE/packages/vx" "$W/node_modules/@vzn/vx"
          cd "$W"
          echo '{"name":"ws","private":true}' > package.json
          printf 'packages:\n  - "packages/*"\n' > pnpm-workspace.yaml
          echo '{"name":"a"}' > packages/a/package.json
          echo x > packages/a/src/x.js
          printf "import { defineProject } from '@vzn/vx'\nexport default defineProject({ tasks: { build: { exec: { command: 'echo built > out.txt' }, cache: { inputs: { files: ['src/**'] }, outputs: { files: ['out.txt'] } } } } })\n" > packages/a/vx.config.mjs
          printf "import { defineWorkspace } from '@vzn/vx'\nexport default defineWorkspace({ plugins: [] })\n" > vx.workspace.mjs
          printf 'node_modules\n.vx\n' > .gitignore
          git init -q && git add -A && git -c user.email=ci@vx -c user.name=ci commit -qm init
          /tmp/vx-ci run build --all
          # The cached run restores the declared output through the binary's
          # own container reader: delete it, and it must come back.
          rm packages/a/out.txt
          /tmp/vx-ci run build --all | grep -q 'a#build'
          test "$(cat packages/a/out.txt)" = "built" || { echo "::error::cached run did not restore out.txt"; exit 1; }
