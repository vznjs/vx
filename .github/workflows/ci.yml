name: CI

on:
  push:
    branches: [main]
  # `closed`: a merged or closed PR's own run joins its concurrency group
  # and cancels the one still running, so its workers free their runners
  # (2026-10-23: workers queued 108-184 s behind merged PRs' runs). Its jobs
  # are skipped.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # The merge queue tests each group's merge before main moves.
  merge_group:
  # Manual re-run without a push — for distinguishing runner-infra flakes
  # from real regressions when a main run goes red. `cold` reads no cache,
  # so every task runs: how DTE packs a full run, measured on demand.
  workflow_dispatch:
    inputs:
      cold:
        description: Read no cache; every task runs
        type: boolean
        default: false

# Checkout is all the token does here: a PR's code runs in these jobs, and
# a default token may hold write access (L-29).
permissions:
  contents: read
  # vxCache() and vxHistory() sign in to our servers with the job's OIDC
  # token, no long-lived secret (.vx/workspace.ts).
  id-token: write

# A newer push to the same PR supersedes an older run, which is cancelled:
# its old head is never merged. Any other run (main, a dispatch) finishes
# and only the queued runs between it and the tip are dropped, or a busy
# main never completes a run, never releases (auto-release.yml) and never
# says it is red.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A stack's top pull request holds every layer below it, and merging it
# merges them all: only it runs CI, so a stack costs one run, not one per
# layer (2026-10-22). Off a stack both sides are null and it runs.
jobs:
  # One distributed run (@vzn/vx-dte, .vx/workspace.ts) for every platform
  # (2026-10-23): a task bound to one (exec.platforms) runs on a
  # worker of it, started only when the graph has one. It checks out, installs Bun and the deps, checks the lock and runs vx,
  # as any repo would (2026-10-23: "super simple, same as devs
  # would add it"). vx names the run, plans it, starts as many workers
  # (vx-worker.yml) as the plan's width needs, cancels them at the end and
  # reads the remote cache; @vzn/vx-ci writes the job summary.
  linux:
    name: VX DTE
    # Main's run waits for the site's benchmark rows (the bench job): a DTE
    # worker is packed beside other tasks, so a benchmark there would time
    # its neighbours, and the site deploys what this run builds. A skipped
    # bench job (a pull request) lets it run.
    needs: bench
    if: "!cancelled() && (needs.bench.result == 'success' || needs.bench.result == 'skipped') && github.event.action != 'closed' && github.event.pull_request.stack.position == github.event.pull_request.stack.size"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A push to main deploys the docs site the run built.
    environment: ${{ github.event_name == 'push' && 'github-pages' || '' }}
    permissions:
      id-token: write
      # Dispatching and cancelling the workers.
      actions: write
      pages: write
      # release.sync gives each GitHub release its post's body.
      contents: write
      # The relay's Workers Builds check names a PR's Preview.
      checks: read
    env:
      VX_DTE_RELAY: https://vx-dte.exelord.workers.dev
      VX_CACHE_URL: https://vx-cache.exelord.workers.dev
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # An unavailable OS sandbox, reftable, tag history, native watcher
      # or non-root user fails its rows instead of skipping them.
      VX_REQUIRE_SANDBOX: '1'
      VX_REQUIRE_REFTABLE: '1'
      VX_REQUIRE_TAGS: '1'
      VX_REQUIRE_WATCH_EVENTS: '1'
      VX_REQUIRE_NONROOT: '1'
      # A PR's title and commits are held to Conventional Commits.
      VX_PR_TITLE: ${{ github.event.pull_request.title }}
      VX_PR_BASE: ${{ github.event.pull_request.base.sha }}
      VX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      # Cold reads nothing but still writes: workers hand outputs back
      # through the remote.
      VX_CACHE_POLICY: ${{ inputs.cold && 'local:w,remote:w' || '' }}
    steps:
      # One commit: --affected and vx-history's timings import fetch
      # the merge-base themselves, commits and trees only; main needs none.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job's token stays out of .git/config, where every task could
        # read it; the repo is public, so a fetch needs none.
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check vx.lock.json
        run: bun packages/vx/src/bin.ts lock --check
      # A PR that changes the relay runs on its own code: Workers Builds'
      # Preview of the head's relay. A push to main that changes it waits
      # for its deploy. Any other run keeps the deployed relay
      # (private/vx-servers/worker-url.ts).
      - name: Pick the relay
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        id: relay
        run: bun private/vx-servers/worker-url.ts private/vx-dte-service VX_DTE_RELAY
      # The cache server the same way: a PR that changes it reads and
      # writes its Preview, handed to the workers (.vx/workspace.ts).
      - name: Pick the cache server
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        id: cache
        run: bun private/vx-servers/worker-url.ts private/vx-cache-service VX_CACHE_URL
      # The Pages deploy is a task of the run (@vzn/vx-docs#deploy.pages,
      # 2026-10-24). GitHub hands the job's runtime token, which
      # uploads the site's artifact, only to JavaScript actions: this hands
      # it to the run, whose env isolation passes it to that task alone.
      - name: Hand the Pages token to the run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL)
      # Plans the graph, starts the workers its width needs, then
      # orchestrates them. A PR runs what its diff affects, inputs outside
      # a project included (2026-10-23); main runs everything.
      # The tasks say what each needs: `ci` is every change's checks, the
      # platform's own tests on Mac workers included, and main's `release`
      # adds the release binaries, their launch checks, the release notes
      # and the site's deploy.
      - name: vx run
        env:
          VX_DTE_RELAY: ${{ steps.relay.outputs.url || env.VX_DTE_RELAY }}
          VX_CACHE_URL: ${{ steps.cache.outputs.url || env.VX_CACHE_URL }}
        run: bun packages/vx/src/bin.ts run --profile=profile.json ci ${{ github.event_name == 'push' && 'release' || '' }} ${{ github.event_name == 'pull_request' && '--affected' || '--all' }}
      # The run in time (--profile): every worker's tasks on their own
      # lanes (@vzn/vx-dte), opened in https://ui.perfetto.dev; the job
      # summary links it.
      - name: Upload the run profile
        if: always()
        id: trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile
          path: profile.json
          if-no-files-found: ignore
      - name: Link the run profile
        if: always() && steps.trace.outputs.artifact-url != ''
        env:
          URL: ${{ steps.trace.outputs.artifact-url }}
        run: echo "[Run profile]($URL), opened in https://ui.perfetto.dev" >> "$GITHUB_STEP_SUMMARY"
      # github() lists each worker run it dispatched: a run cancelled or
      # timed out can die before it cancels them itself (2026-10-28).
      - name: Cancel the workers
        if: cancelled()
        run: |
          [ -f "$RUNNER_TEMP/vx-dte-runs" ] || exit 0
          while read -r run; do curl -sS -o /dev/null -X POST -H "authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API_URL$run/cancel" || true; done < "$RUNNER_TEMP/vx-dte-runs"

  # The site's head-to-head rows (@vzn/vx-bench#site.numbers), on a runner
  # of their own and one runner at a time, before main's run: that run
  # then restores them from the remote cache and deploys the site with
  # them. A runner's task re-measures only when its key changes (vx's
  # source, or the harness and a rival's pin).
  bench:
    name: Bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: vx run site.numbers
        run: bun packages/vx/src/bin.ts run site.numbers --all --concurrency 1

  # The benchmarks, on a runner of their own: they time the machine, and a
  # DTE worker is packed for the run's wall time, not a task's
  # (2026-10-24). Beside the run, so off its critical path; no relay, so
  # vx runs them here.
  perf:
    name: Perf
    if: github.event.action != 'closed' && github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: vx run check.perf
        run: bun packages/vx/src/bin.ts run check.perf ${{ github.event_name == 'pull_request' && '--affected' || '--all' }}
