name: Deploy docs

# Builds the Starlight docs site (packages/vx-docs) and publishes it to GitHub
# Pages. Enable once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'packages/vx/docs/**'
      - 'packages/vx-docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sandbox runtime deps: every task in this repo declares
      # `exec.sandbox`, so a runner that runs a vx task needs bubblewrap
      # (isolation), socat (network bridge) and ripgrep. Ubuntu 24's
      # AppArmor blocks the unprivileged user namespaces bwrap needs.
      - name: Install sandbox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat strace ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -f /etc/apparmor.d/unprivileged_userns ]; then
            sudo aa-disable /etc/apparmor.d/unprivileged_userns || true
          fi

      # Warm bun's cross-compile targets BEFORE the sandbox sees them.
      # `bun build --compile` downloads `@oven/bun-<target>` into
      # `~/.bun/install/cache` on first use; a sandboxed task may READ that
      # cache (only the workspace root is denied) but not write it, so on a
      # cold runner the download fails with a misleading
      # "Network error … check your proxy settings". Warming it here keeps
      # the build tasks' grants as tight as they are on a dev machine, where
      # the cache is already populated. Measured 2026-09-05: cold sandboxed
      # build fails, same build after this step succeeds.
      - name: Warm bun cross-compile targets
        run: |
          echo 'console.log(0)' > /tmp/warm.ts
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target="bun-$t" /tmp/warm.ts --outfile "/tmp/warm-$t" >/dev/null
          done

      # Generating the Starlight collection from `docs/` crosses project
      # boundaries, so it is a workspace step, not an vx-docs task.
      - name: Generate site content from docs/
        run: bun run docs:generate

      # Dogfood: build the docs site through vx from the repo root, scoped
      # to the docs project. `import` regenerates the Starlight content from
      # docs/, then `astro build` writes packages/vx-docs/dist.
      - name: vx run build
        run: bun packages/vx/src/bin.ts run build --filter @vzn/vx-docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/vx-docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
