name: Docker image

# Build the @vzn/vx-cloud service image and publish it to the GitHub
# Container Registry (ghcr.io/<owner>/vx-cloud).
#
# - push to main            → build + push `latest`, `main`, `sha-<short>`
# - release published       → build + push `X.Y.Z` and `X.Y`
# - pull_request            → build ONLY (no push), to catch Dockerfile breakage
# - workflow_dispatch       → manual build + push
#
# The build context is the REPO ROOT (core + cloud share one workspace and
# lockfile); the Dockerfile compiles `vx-cloud` to a standalone binary and
# ships it on the slim Bun base. See packages/cloud/Dockerfile.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/cloud/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'packages/cloud/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
  release:
    types: [published]
  workflow_dispatch:

# Cancel a superseded run for the same ref (a newer push replaces an in-flight build).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vx-cloud

jobs:
  image:
    name: build & push vx-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR only when we intend to push (not on PRs, where a
      # fork wouldn't have packages:write anyway). The built-in GITHUB_TOKEN
      # gets packages:write from the job `permissions` block above.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cloud/Dockerfile
          platforms: linux/amd64
          # Push on every event EXCEPT pull_request (PRs validate the build only).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
