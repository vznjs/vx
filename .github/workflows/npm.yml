name: npm publish

# Publishes `@vzn/vx` as a no-Bun standalone binary: library source PLUS a
# Node launcher that execs a prebuilt standalone binary shipped per-platform
# (@vzn/vx-<os>-<cpu>) as an optionalDependency. No Bun, no download.
#
# Auth is npm **Trusted Publishing (OIDC)** — this file reads no secret and
# sets no NODE_AUTH_TOKEN (a token in the environment would take precedence
# over the OIDC exchange, which is why none is set — see the Publish steps).
# The job requests an OIDC token (`id-token: write`) and npm (>= 11.5.1)
# exchanges it for a short-lived, package-scoped credential + provenance.
# Configure a Trusted Publisher on npmjs.com for EACH package name
# (@vzn/vx, the four @vzn/vx-<target>, and every public packages/* the
# assemble step emits), linking this repo + this workflow.
#
# Every step past the setup is a `release.*` vx task (packages/vx/
# vx.config.ts, scripts/release.ts): CI runs vx tasks, not commands of its
# own (2026-10-03). The version reaches them as VX_RELEASE_VERSION,
# never pasted into a script, and each refuses one that is not a version
# (L-28).
#
# - release published   → publish the release version
# - workflow_dispatch   → publish, or dry-run, a chosen version manually.
#   A dispatch runs THIS file from the default branch but builds whatever
#   `ref` names, so a release whose publish failed on a workflow bug is
#   completed by dispatching the fixed workflow at that release's tag
#   (`version: 0.0.20`, `ref: v0.0.20`) — the tag's code, the fixed steps.
#   The tag's code must hold the `release.*` tasks this file runs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scripts:
        description: "Run this workflow commit's packages/vx/scripts against the tag (rebuilds a tag whose release scripts had a bug)."
        type: boolean
        default: false
      version:
        description: 'Version to build/publish (e.g. 1.2.3). Defaults to the release tag.'
        required: false
      ref:
        description: 'Release tag to build (e.g. v0.0.20). Defaults to the release tag, or this branch.'
        required: false
      dry_run:
        description: 'Build the tree but do not publish.'
        type: boolean
        default: false

# Default-deny; each job grants only what it needs (contents: read for the
# checkout, id-token: write for npm's OIDC exchange). No long-lived npm
# token exists anywhere in this workflow: auth is trusted publishing.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # The darwin binaries are built here, on macOS, where a binary macOS
  # refuses can be re-signed: Bun 1.4.0's `--compile` signature was rejected
  # (SIGKILL on launch) until re-signed ad hoc, and only a macOS runner has
  # codesign. So the two darwin platform packages come from this job, and
  # the ubuntu job publishes @vzn/vx after them.
  darwin:
    name: build, sign & publish darwin packages
    runs-on: macos-latest
    timeout-minutes: 25
    # npm's trusted publisher names this environment, whose branch rule
    # admits main and the release tags only.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VX_RELEASE_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A tag only: any token with actions: write can dispatch this.
          ref: ${{ github.event.inputs.ref && format('refs/tags/{0}', github.event.inputs.ref) || '' }}
          persist-credentials: false
      # Rebuilding an older tag whose release scripts had a bug (v0.0.647's
      # darwin check compared a coloured --version): the tag's code builds and
      # ships, and this workflow's commit supplies packages/vx/scripts.
      - if: inputs.scripts
        run: git fetch --depth=1 origin "$GITHUB_SHA" && git checkout FETCH_HEAD -- packages/vx/scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - name: Check npm can publish with provenance, and stamp the version
        run: bun packages/vx/src/bin.ts run release.npm release.stamp --filter @vzn/vx
      - name: Build the darwin binaries
        run: bun packages/vx/src/bin.ts run build.bun.darwin-x64 build.bun.darwin-arm64 --filter @vzn/vx --concurrency 2
      - name: Prove the darwin binaries launch and report the version
        run: bun packages/vx/src/bin.ts run release.prove.darwin --filter @vzn/vx
      - name: Assemble the darwin platform packages
        run: bun packages/vx/src/bin.ts run release.assemble.darwin --filter @vzn/vx
      - name: Publish darwin platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC token for a
        # short-lived publish credential (trusted publishing, npm >= 11.5.1)
        # and attaches provenance. A set token would take precedence and is
        # what npm now restricts ("tokens that bypass 2FA are being
        # restricted for direct publishing" — the E401 that stopped v0.0.17).
        run: bun packages/vx/src/bin.ts run release.publish.darwin --filter @vzn/vx

  publish:
    name: build & publish @vzn/vx
    needs: darwin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance
    env:
      VX_RELEASE_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A tag only: any token with actions: write can dispatch this.
          ref: ${{ github.event.inputs.ref && format('refs/tags/{0}', github.event.inputs.ref) || '' }}
          persist-credentials: false

      # Rebuilding an older tag whose release scripts had a bug (v0.0.647's
      # darwin check compared a coloured --version): the tag's code builds and
      # ships, and this workflow's commit supplies packages/vx/scripts.
      - if: inputs.scripts
        run: git fetch --depth=1 origin "$GITHUB_SHA" && git checkout FETCH_HEAD -- packages/vx/scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Node runs `npm publish`. No token: auth comes from the OIDC
      # exchange. Node 24's BUNDLED npm is already >= 11.5.1 (trusted-
      # publishing capable), so `release.npm` upgrades nothing here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sandbox runtime, as @vzn/vx-ci sets it up. Every task this job
      # runs declares `exec.sandbox`, and a declared sandbox that cannot be
      # built is a hard error: without it v0.0.20's compile tasks failed in
      # 0 ms and @vzn/vx never reached `npm publish`.
      - run: bun packages/vx/src/bin.ts setup github

      - name: Check npm can publish with provenance, and stamp the version
        run: bun packages/vx/src/bin.ts run release.npm release.stamp --filter @vzn/vx

      # Cross-compile the linux binaries (one cached task per target).
      # --concurrency 2: concurrent `--compile --minify --bytecode` builds
      # OOM a 7 GB runner. The darwin binaries come from the `darwin` job,
      # which can sign them.
      - name: Build the linux binaries
        run: bun packages/vx/src/bin.ts run build.bun.linux-x64 build.bun.linux-arm64 --filter @vzn/vx --concurrency 2
      - name: Prove the stamp took
        run: bun packages/vx/src/bin.ts run release.prove.linux --filter @vzn/vx
      - name: Assemble npm tree (linux platform packages, @vzn/vx, the plugins)
        run: bun packages/vx/src/bin.ts run release.assemble.linux --filter @vzn/vx
      # No NODE_AUTH_TOKEN — see the darwin step: trusted publishing only.
      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bun packages/vx/src/bin.ts run release.publish.linux --filter @vzn/vx
      - name: Wait until npm serves every tarball
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bun packages/vx/src/bin.ts run release.served --filter @vzn/vx
