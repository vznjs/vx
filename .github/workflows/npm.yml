name: npm publish

# Publishes `@vzn/vx` as a no-Bun standalone binary: library source PLUS a
# Node launcher that execs a prebuilt standalone binary shipped per-platform
# (@vzn/vx-<os>-<cpu>) as an optionalDependency. No Bun, no download.
#
# Auth is npm **Trusted Publishing (OIDC)** — no NPM_TOKEN secret (a scope-wide
# NPM_TOKEN, if set, is used instead — see the Publish step). The job requests
# an OIDC token (`id-token: write`) and npm (>= 11.5.1) exchanges it for a
# short-lived, package-scoped credential + provenance. Configure a Trusted
# Publisher on npmjs.com for EACH of the FIVE package names (@vzn/vx and the
# four @vzn/vx-<target>), linking this repo + this workflow.
#
# - release published   → publish the release version
# - workflow_dispatch   → publish, or dry-run, a chosen version manually

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/publish (e.g. 1.2.3). Defaults to the release tag.'
        required: false
      dry_run:
        description: 'Build the tree but do not publish.'
        type: boolean
        default: false

# Default-deny; each job grants only what it needs (contents: read for the
# checkout, id-token: write for npm's OIDC exchange). No long-lived npm
# token exists anywhere in this workflow: auth is trusted publishing.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # The darwin binaries are built AND SIGNED here. Bun 1.4.0's `--compile`
  # signature is rejected by macOS (SIGKILL on launch) until re-signed ad hoc,
  # and only a macOS runner has codesign — so the two darwin platform packages
  # come from this job, and the ubuntu job publishes @vzn/vx after them.
  darwin:
    name: build, sign & publish darwin packages
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm publishes with provenance (>= 11.5.1, sigstore intact)
        run: |
          set -e
          current="$(npm --version)"
          echo "bundled npm: $current"
          if node -e 'const [a,b,c]=process.argv[1].split("-")[0].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$current"; then
            echo "npm $current already supports trusted publishing — using it as-is"
          else
            echo "bundled npm $current too old; upgrading"
            npm install -g npm@latest
            npm --version
          fi
          # sigstore lives under the active global npm's own node_modules.
          resolves() { node -e "require.resolve('sigstore', { paths: [require('node:path').join('$(npm root -g)', 'npm')] })" >/dev/null 2>&1; }
          if resolves; then
            echo "provenance dep 'sigstore' resolves OK"
          else
            echo "'sigstore' missing from npm — repairing with a forced clean reinstall"
            npm install -g npm@latest --force
            npm --version
            if ! resolves; then
              echo "::error::npm cannot load 'sigstore' for provenance generation; publish would crash. Aborting before the publish loop." >&2
              exit 1
            fi
            echo "repaired — 'sigstore' now resolves"
          fi

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.version || github.event.release.tag_name }}"
          if [ -z "$RAW" ]; then echo "no version (not a release and no input)"; exit 1; fi
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      # packages/vx/package.json is the manifest `src/version.ts` inlines;
      # stamping the root one (as this did until 2026-09-03) leaves the
      # binary at `vx 0.0.0`. The build step asserts the stamp took.
      - name: Stamp version
        run: |
          bun -e 'const f = "packages/vx/package.json"; const p = await Bun.file(f).json(); p.version = process.argv[1]; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")' "${{ steps.version.outputs.version }}"
      - name: Build, sign and prove the darwin binaries
        run: |
          bun packages/vx/src/bin.ts run build.bun.darwin-x64 build.bun.darwin-arm64 --filter @vzn/vx --concurrency 2
          for f in packages/vx/dist/vx-darwin-*; do codesign -s - --force "$f"; codesign --verify --verbose=2 "$f"; done
          GOT="$(packages/vx/dist/vx-darwin-arm64 --version)"
          test "$GOT" = "vx ${{ steps.version.outputs.version }}" || { echo "binary reports '$GOT', expected 'vx ${{ steps.version.outputs.version }}'"; exit 1; }
      - name: Assemble the darwin platform packages
        run: |
          bun packages/vx/scripts/build-npm.ts "${{ steps.version.outputs.version }}" --only=darwin-x64 --out=dist/npm
          bun packages/vx/scripts/build-npm.ts "${{ steps.version.outputs.version }}" --only=darwin-arm64 --out=dist/npm-arm64
          cp -r dist/npm-arm64/@vzn/vx-darwin-arm64 dist/npm/@vzn/
      - name: Publish darwin platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC token for a
        # short-lived publish credential (trusted publishing, npm >= 11.5.1)
        # and attaches provenance. A set token would take precedence and is
        # what npm now restricts ("tokens that bypass 2FA are being
        # restricted for direct publishing" — the E401 that stopped v0.0.17).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          for pkg in dist/npm/@vzn/vx-darwin-x64 dist/npm/@vzn/vx-darwin-arm64; do
            name="$(node -p "require('$(pwd)/$pkg/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on the registry — skipping"
            else
              npm publish "$pkg" --access public --provenance
            fi
          done

  publish:
    name: build & publish @vzn/vx
    needs: darwin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Node runs `npm publish`; registry-url points it at npm. No token — auth
      # comes from the OIDC exchange below. Node 24's BUNDLED npm is already
      # >= 11.5.1 (trusted-publishing capable), so no in-place self-upgrade is
      # needed — that upgrade, from node 22's old bundled npm 10.x, corrupted
      # npm's own dependency tree and left `libnpmpublish` unable to
      # `require('sigstore')` when it auto-generates provenance under OIDC.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1. Node 24 bundles a new-enough
      # npm, so this only self-upgrades on the (unexpected) chance the bundled
      # one is older — the in-place `npm i -g npm@latest` is exactly what broke
      # sigstore before, so we avoid it whenever the bundled npm already works.
      #
      # Then HARD-VERIFY the provenance dependency chain: `libnpmpublish`
      # `require('sigstore')` to generate provenance (auto-enabled under OIDC),
      # and a corrupted self-upgrade drops it — the exact failure that aborted
      # the release mid-publish with a cryptic MODULE_NOT_FOUND. We resolve it
      # up front: if missing, repair with a forced clean reinstall, then FAIL
      # THE JOB with a clear message if it still can't load (never let the
      # publish loop hit it).
      - name: Ensure npm publishes with provenance (>= 11.5.1, sigstore intact)
        run: |
          set -e
          current="$(npm --version)"
          echo "bundled npm: $current"
          if node -e 'const [a,b,c]=process.argv[1].split("-")[0].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$current"; then
            echo "npm $current already supports trusted publishing — using it as-is"
          else
            echo "bundled npm $current too old; upgrading"
            npm install -g npm@latest
            npm --version
          fi
          # sigstore lives under the active global npm's own node_modules.
          resolves() { node -e "require.resolve('sigstore', { paths: [require('node:path').join('$(npm root -g)', 'npm')] })" >/dev/null 2>&1; }
          if resolves; then
            echo "provenance dep 'sigstore' resolves OK"
          else
            echo "'sigstore' missing from npm — repairing with a forced clean reinstall"
            npm install -g npm@latest --force
            npm --version
            if ! resolves; then
              echo "::error::npm cannot load 'sigstore' for provenance generation; publish would crash. Aborting before the publish loop." >&2
              exit 1
            fi
            echo "repaired — 'sigstore' now resolves"
          fi

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.version || github.event.release.tag_name }}"
          if [ -z "$RAW" ]; then echo "no version (not a release and no input)"; exit 1; fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stamp the version into packages/vx/package.json BEFORE compiling —
      # `src/version.ts` inlines THAT manifest under `bun build --compile`,
      # so the binary must be built with the release version in place (the
      # root manifest, stamped here until 2026-09-03, is read by nothing).
      # Ephemeral (CI only, never committed).
      - name: Stamp version
        run: |
          bun -e 'const f = "packages/vx/package.json"; const p = await Bun.file(f).json(); p.version = process.argv[1]; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")' "${{ steps.version.outputs.version }}"

      # Cross-compile the four standalone binaries (fanned out + cached by
      # vx). --concurrency 2: concurrent `--compile --minify --bytecode`
      # builds OOM a 7 GB runner.
      # Linux targets only — the darwin binaries come from the `darwin` job
      # below, which can sign them. `vx run build.bun.<target>` is one task
      # per target with its own cache slot.
      - name: Build linux binaries and prove the stamp took
        run: |
          bun packages/vx/src/bin.ts run build.bun.linux-x64 build.bun.linux-arm64 --filter @vzn/vx --concurrency 2
          GOT="$(packages/vx/dist/vx-linux-x64 --version)"
          test "$GOT" = "vx ${{ steps.version.outputs.version }}" || { echo "binary reports '$GOT', expected 'vx ${{ steps.version.outputs.version }}' — the stamp missed the manifest the binary inlines"; exit 1; }
      - name: Assemble npm tree (linux platform packages + @vzn/vx)
        run: |
          bun packages/vx/scripts/build-npm.ts "${{ steps.version.outputs.version }}" --only=linux-x64 --out=dist/npm
          bun packages/vx/scripts/build-npm.ts "${{ steps.version.outputs.version }}" --only=linux-arm64 --out=dist/npm-arm64
          cp -r dist/npm-arm64/@vzn/vx-linux-arm64 dist/npm/@vzn/
      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # No NODE_AUTH_TOKEN — see the darwin step: trusted publishing only.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          # Order matters: the platform binaries first (so the main package's
          # optionalDependencies resolve on the registry), then the main
          # package.
          #
          # Idempotent: a 5-package sequential publish can fail partway (a
          # transient registry error, or an earlier abort), and npm 403s on
          # republishing an existing version. So skip any package already on
          # the registry at this version — a re-run then completes the set
          # instead of aborting on the first already-published one.
          # The darwin platform packages were published by the `darwin` job;
          # @vzn/vx goes last so every optionalDependency it names exists.
          for pkg in \
            dist/npm/@vzn/vx-linux-x64 \
            dist/npm/@vzn/vx-linux-arm64 \
            dist/npm/vx; do
            name="$(node -p "require('$(pwd)/$pkg/package.json').name")"
            echo "::group::npm publish $name@$VERSION ($pkg)"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on the registry — skipping"
            else
              npm publish "$pkg" --access public --provenance
            fi
            echo "::endgroup::"
          done
