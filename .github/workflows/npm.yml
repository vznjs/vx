name: npm

# A release, as one distributed run (@vzn/vx-dte): `vx pipeline npm`
# (.vx/workspace.ts) compiles the binaries once, proves them (the darwin
# ones on a Mac worker, which re-signs one macOS refuses), attests and
# attaches them to the draft release (the last upload publishes it),
# publishes the npm packages and pushes the server images. Every step is a
# `release.*` task (packages/vx/vx.config.ts); a worker runs it with this
# job's environment, so its tokens and its OIDC identity are this job's:
# npm's trusted publisher for every package names npm.yml and the npm
# environment, and the attestations name npm.yml.
#
# auto-release.yml dispatches it on the tag it created, whose draft release
# it fills. A maintainer may dispatch it on a tag too: each step skips what
# is already done (an uploaded asset, a published package), so a re-run
# completes a release that is still a draft.

on:
  workflow_dispatch:

# Default-deny; the job grants what it needs.
permissions: {}

# Two runs of one tag would upload to the same draft, and the first to
# finish would publish it with the other's uploads still going: the second
# waits. Never cancelled: a run stopped mid-upload leaves a draft half
# attached.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: VX DTE release
    # A tag only: a dispatch on a branch builds, attests and publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # npm's trusted publisher names this environment, whose rule admits the
    # release tags only.
    environment: npm
    permissions:
      # The draft release's assets and its publishing.
      contents: write
      # npm's OIDC exchange, the attestations' Sigstore certificate, and the
      # relay and the cache server.
      id-token: write
      attestations: write
      # The server images on ghcr.io.
      packages: write
      # Dispatching and cancelling the workers.
      actions: write
    env:
      VX_RELEASE_VERSION: ${{ github.ref_name }}
      VX_CACHE_URL: https://vx-cache.exelord.workers.dev
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check vx.lock.json
        run: bun packages/vx/src/bin.ts lock --check
      - name: vx pipeline npm
        run: bun packages/vx/src/bin.ts pipeline npm
