name: npm publish

# Publishes two families, BOTH as no-Bun standalone binaries:
#   - `@vzn/vx` — the CLI: library source PLUS a Node launcher that execs a
#     prebuilt standalone binary shipped per-platform (@vzn/vx-<os>-<cpu>) as
#     an optionalDependency. No Bun, no download.
#   - `@vzn/vx-cloud` — the orchestrator service + `cloud()` plugin: the same
#     launcher model (@vzn/vx-cloud-<os>-<cpu> platform binaries, dashboard
#     embedded), plus the plugin as importable source; depends on `@vzn/vx`
#     at the same version.
#
# Auth is npm **Trusted Publishing (OIDC)** — no NPM_TOKEN secret (a scope-wide
# NPM_TOKEN, if set, is used instead — see the Publish step). The job requests
# an OIDC token (`id-token: write`) and npm (>= 11.5.1) exchanges it for a
# short-lived, package-scoped credential + provenance. Configure a Trusted
# Publisher on npmjs.com for EACH of the TEN package names (@vzn/vx, the four
# @vzn/vx-<target>, @vzn/vx-cloud, and the four @vzn/vx-cloud-<target>),
# linking this repo + this workflow.
#
# - release published   → publish the release version
# - workflow_dispatch   → publish, or dry-run, a chosen version manually

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/publish (e.g. 1.2.3). Defaults to the release tag.'
        required: false
      dry_run:
        description: 'Build the tree but do not publish.'
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: build & publish @vzn/vx
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node runs `npm publish`; registry-url points it at npm. No token — auth
      # comes from the OIDC exchange below. Node 24's BUNDLED npm is already
      # >= 11.5.1 (trusted-publishing capable), so no in-place self-upgrade is
      # needed — that upgrade, from node 22's old bundled npm 10.x, corrupted
      # npm's own dependency tree and left `libnpmpublish` unable to
      # `require('sigstore')` when it auto-generates provenance under OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1. Node 24 bundles a new-enough
      # npm, so this only self-upgrades on the (unexpected) chance the bundled
      # one is older — the in-place `npm i -g npm@latest` is exactly what broke
      # sigstore before, so we avoid it whenever the bundled npm already works.
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          current="$(npm --version)"
          echo "bundled npm: $current"
          if node -e 'const [a,b,c]=process.argv[1].split("-")[0].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$current"; then
            echo "npm $current already supports trusted publishing — using it as-is"
          else
            echo "bundled npm $current too old; upgrading"
            npm install -g npm@latest
            npm --version
          fi

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.version || github.event.release.tag_name }}"
          if [ -z "$RAW" ]; then echo "no version (not a release and no input)"; exit 1; fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stamp the version into package.json BEFORE compiling — `vx --version`
      # reads it from package.json (inlined by `bun build --compile`), so the
      # binary must be built with the release version in place. Ephemeral (CI
      # only, never committed).
      - name: Stamp version
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); p.version = process.argv[1]; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")' "${{ steps.version.outputs.version }}"

      # Cross-compile all EIGHT standalone binaries (4 vx + 4 vx-cloud, fanned
      # out + cached by vx). --concurrency 2: eight concurrent
      # `--compile --minify --bytecode` builds OOM a 7 GB runner.
      - name: Build binaries
        run: bun src/bin.ts run build --concurrency 2

      - name: Assemble npm tree
        run: bun scripts/build-npm.ts "${{ steps.version.outputs.version }}"

      # Platform packages FIRST so the main package's optionalDependencies
      # resolve on the registry, then the primary @vzn/vx package. Trusted
      # Publishing (OIDC) supplies auth + provenance — no token needed.
      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # Dual auth: if an NPM_TOKEN secret exists it's used (one token covers
        # the whole @vzn scope); otherwise it's empty and npm falls back to the
        # OIDC Trusted Publishing exchange. Either "npm connected to gh" setup
        # works — no config change needed here.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          # Order matters: each family's platform binaries first (so the main
          # package's optionalDependencies resolve on the registry), then the
          # main package. @vzn/vx-cloud last — it depends on @vzn/vx.
          #
          # Idempotent: a 10-package sequential publish can fail partway (a
          # transient registry error, or an earlier abort), and npm 403s on
          # republishing an existing version. So skip any package already on
          # the registry at this version — a re-run then completes the set
          # instead of aborting on the first already-published one.
          for pkg in \
            dist/npm/@vzn/vx-linux-x64 \
            dist/npm/@vzn/vx-linux-arm64 \
            dist/npm/@vzn/vx-darwin-x64 \
            dist/npm/@vzn/vx-darwin-arm64 \
            dist/npm/vx \
            dist/npm/@vzn/vx-cloud-linux-x64 \
            dist/npm/@vzn/vx-cloud-linux-arm64 \
            dist/npm/@vzn/vx-cloud-darwin-x64 \
            dist/npm/@vzn/vx-cloud-darwin-arm64 \
            dist/npm/vx-cloud; do
            name="$(node -p "require('$(pwd)/$pkg/package.json').name")"
            echo "::group::npm publish $name@$VERSION ($pkg)"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on the registry — skipping"
            else
              npm publish "$pkg" --access public
            fi
            echo "::endgroup::"
          done
