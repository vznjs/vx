name: vx distributed CI (reusable)

# A REFERENCE reusable workflow: fan a `vx run <task>` across a matrix of
# ephemeral vx-cloud agents. This is a TEMPLATE consumers `uses:` (or copy) —
# it does NOT run in this repo's own CI. Call it from your workflow:
#
#   # .github/workflows/ci.yml
#   name: CI
#   on: [push, pull_request]
#   jobs:
#     distributed:
#       uses: vznjs/vx/.github/workflows/vx-distributed-ci.yml@main
#       with:
#         task: ci        # the vx task/group to run (append flags: "ci --all")
#         agents: 6       # number of ephemeral agent jobs
#       secrets:
#         VX_CLOUD_URL: ${{ secrets.VX_CLOUD_URL }}
#         VX_CLOUD_TOKEN: ${{ secrets.VX_CLOUD_TOKEN }}
#
# Requires: a reachable `vx-cloud serve` (see the Self-host guide) and the
# cloud() plugin declared in your vx.workspace.ts — without it `--distribute`
# is recorded but a run stays local:
#
#   import { defineWorkspace } from '@vzn/vx'
#   import { cloud } from '@vzn/vx-cloud/plugin'
#   export default defineWorkspace({ plugins: [cloud()] })
#
# Pin `@main` (here and the action ref below) to a release tag for
# reproducible CI.

on:
  workflow_call:
    inputs:
      task:
        description: The vx task or group to run distributed (append flags, e.g. "ci --all").
        type: string
        default: ci
      agents:
        description: How many ephemeral agent jobs to launch.
        type: number
        default: 3
      capacity:
        description: Parallel assignments per agent.
        type: number
        default: 4
    secrets:
      VX_CLOUD_URL:
        description: The vx-cloud serve every job connects to.
        required: true
      VX_CLOUD_TOKEN:
        description: A `vxc_` API token (Admin → Tokens on the platform) — the agent and cache surfaces are machine-token-only.
        required: true

jobs:
  # A matrix can't take a bare count, so turn `agents: N` into the list [1..N].
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          AGENTS: ${{ inputs.agents }}
        run: echo "matrix=$(seq 1 "$AGENTS" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # The agent matrix. Each job checks out the same commit, installs the
  # workspace toolchain (swap in your package manager), then runs one agent
  # via the composite action. fail-fast off: one flaky agent must not cancel
  # the pool — the run job owns the verdict.
  agents:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: vznjs/vx/.github/actions/vx-agent@main
        with:
          url: ${{ secrets.VX_CLOUD_URL }}
          token: ${{ secrets.VX_CLOUD_TOKEN }}
          capacity: ${{ inputs.capacity }}
          session: ${{ github.run_id }}-${{ github.run_attempt }}

  # The main job. Runs in parallel with the agents and submits with EXPLICIT
  # distribution (VX_CLOUD_DISTRIBUTE) — NOT the ambient `connect --distribute`
  # mode. Ambient fails SAFE to a silent local run when zero remote agents have
  # registered at the instant of submit, and this matrix races the submitter:
  # whenever the run job's setup wins, ambient would quietly run local while N
  # paid agent jobs idle to their timeout. Explicit mode submits regardless
  # (agents join mid-run), hard-errors on an unreachable serve, and warns
  # loudly if no remote agent ever joins — the right CI semantics. The
  # submitter self-registers as an agent, so there is never a deadlock.
  #
  # VX_CLOUD_URL/TOKEN drive the connection (analytics, remote cache,
  # distribution) directly — no `vx-cloud connect` step and no vx-cloud CLI
  # needed here; only the agents run the vx-cloud binary.
  run:
    runs-on: ubuntu-latest
    env:
      VX_CLOUD_URL: ${{ secrets.VX_CLOUD_URL }}
      VX_CLOUD_TOKEN: ${{ secrets.VX_CLOUD_TOKEN }}
      # Submitter + every agent derive the SAME session from this.
      VX_AGENT_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
      VX_CLOUD_DISTRIBUTE: ${{ inputs.agents }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --affected needs history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The `vx` CLI — a prebuilt standalone binary via optionalDependencies
      # (no Bun needed for vx itself). Requires @vzn/vx's first npm publish;
      # until then use your workspace's own vx dependency instead.
      - run: npm i -g @vzn/vx

      # A NORMAL vx run — the workspace's cloud() plugin reads VX_CLOUD_* and
      # routes the graph to the session pool.
      - name: Run distributed
        shell: bash
        run: |
          set -eu
          # Intentional word-splitting so `task: "ci --all"` passes extra flags.
          # shellcheck disable=SC2086
          vx run $TASK
