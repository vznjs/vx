name: Release

# Cuts a new patch release every time something lands on `main`.
# Skips itself when the head commit was made by this workflow (so the
# release commit doesn't trigger another release).
#
# Manual override: workflow_dispatch with `bump: minor` (or `patch`,
# the default) lets a maintainer cut a minor bump when a release
# warrants it. Major is locked at 0 for now (pre-alpha).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (always within 0.x.x)'
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Don't re-release on the auto-tag commit itself (defensive — we
    # don't push commits from this workflow, but if a maintainer ever
    # tags manually with a commit, this guards against a loop).
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v0.*' --sort=-v:refname | head -n1)
          if [ -z "$prev" ]; then
            next="v0.0.1"
            major=0
            minor=0
            patch=1
          else
            # Parse v0.MINOR.PATCH
            ver=${prev#v}
            major=$(echo "$ver" | cut -d. -f1)
            minor=$(echo "$ver" | cut -d. -f2)
            patch=$(echo "$ver" | cut -d. -f3)
            bump='${{ inputs.bump }}'
            bump=${bump:-patch}
            if [ "$bump" = "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Cutting $next (previous: ${prev:-<none>})"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.next }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile binaries
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.version.outputs.next }}"
          version_no_v="${version#v}"
          # Bun targets per the docs (bun-<os>-<arch>). vx spawns
          # POSIX shell so we deliberately skip Windows.
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            out="dist/vx-${version_no_v}-${target}"
            bun build --compile --minify --sourcemap --bytecode \
              --target="bun-${target}" \
              ./src/bin.ts --outfile "$out"
            # Smoke the linux-x64 binary on the runner; others are
            # built but we trust the compile output (no qemu setup).
            if [ "$target" = "linux-x64" ]; then
              "$out" --version
            fi
          done
          # Checksums file for verification.
          (cd dist && sha256sum vx-*-* > SHA256SUMS.txt)
          ls -la dist

      - name: Generate release notes
        if: steps.check.outputs.exists != 'true'
        env:
          PREV_TAG: ${{ steps.version.outputs.prev }}
          NEW_TAG: ${{ steps.version.outputs.next }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun scripts/release-notes.ts

      - name: Create tag
        if: steps.check.outputs.exists != 'true'
        run: |
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file release-notes.md \
            dist/vx-*-* dist/SHA256SUMS.txt
