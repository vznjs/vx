name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - id: v
        # Bump from latest v0.* tag. `feat:` in commits since → minor, else patch.
        # Breaking-change markers ignored (we're capped at 0.x.x).
        run: |
          prev=$(git tag --list 'v0.*' --sort=-v:refname | head -n1)
          IFS=. read M m p <<<"${prev#v}"
          M=${M:-0}; m=${m:-0}; p=${p:-0}
          if [ -n "$prev" ] && git log "$prev..HEAD" --pretty=%s | grep -qE '^feat(\(|:)'; then
            m=$((m+1)); p=0
          else
            p=$((p+1))
          fi
          echo "tag=v$M.$m.$p" >> $GITHUB_OUTPUT
          echo "prev=$prev"    >> $GITHUB_OUTPUT

      - name: Compile binaries
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --minify --bytecode --target=bun-$t \
              src/bin.ts --outfile "dist/vx-${{ steps.v.outputs.tag }}-$t"
          done

      - name: Release notes
        run: |
          {
            echo "## Changes"
            range="HEAD"; [ -n "${{ steps.v.outputs.prev }}" ] && range="${{ steps.v.outputs.prev }}..HEAD"
            git log "$range" --reverse --no-merges --pretty='- %s'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          body_path: notes.md
          files: dist/*
