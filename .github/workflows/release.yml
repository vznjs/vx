name: Release assets

# Dispatched by auto-release.yml with the tag it just created (or by hand,
# for a draft release a maintainer made). Runs `vx run build.bun` (which
# fans out to one task per target with per-binary caching), then attaches
# the four vx-<target> binaries (for the curl installer + `vx upgrade`)
# to the release. This repo's releases are immutable: assets attach only
# to a draft, so the release arrives as one and the last upload publishes
# it (scripts/release-assets.ts). A `release: published` trigger would
# fire only once the release can no longer take assets.
# A manual release's body is the maintainer's; an auto-release's is
# written by packages/vx/scripts/release-notes.ts from the Conventional
# Commits since the last tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release to build, attach binaries to and publish (e.g. v0.0.22).'
        required: true

permissions:
  contents: write
  # Build provenance for every binary the release carries: `vx upgrade`'s
  # SHA-256 comes from the same API as the asset, so it proves the transfer,
  # not who built it. A Sigstore-signed attestation, verified with
  # `gh attestation verify vx-<target> --repo vznjs/vx`, does.
  id-token: write
  attestations: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VX_RELEASE_VERSION: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # What a Linux runner needs before `vx run` executes a sandboxed task:
      # the sandbox runtime's deps (every task here declares `exec.sandbox`)
      # and the AppArmor userns restriction Ubuntu 24 imposes lifted. Shared with ci.yml
      # and npm.yml so the deps are named in ONE place — npm.yml not having
      # them is what stopped v0.0.20's publish.
      - uses: ./.github/actions/vx-runner

      # Stamp the release version into packages/vx/package.json BEFORE
      # compiling — `src/version.ts` inlines THAT manifest under
      # `bun build --compile` (scripts/release.ts says why that file).
      # Ephemeral (CI only); sign-darwin proves it took.
      - run: bun packages/vx/src/bin.ts run release.stamp --filter @vzn/vx

      # Dogfood: `build.bun` fans out to `build.bun.<target>` (four
      # compiles). Each sub-task is individually cached, so re-running this
      # workflow on the same commit is essentially free. --concurrency 2:
      # concurrent `--compile --minify --bytecode` builds OOM a 7 GB runner
      # (this workflow OOM'd before with only four).
      - run: bun packages/vx/src/bin.ts run build.bun --filter @vzn/vx --concurrency 2

      # The darwin binaries are proven on macOS before they ship. Bun
      # 1.4.0's `--compile` wrote an ad-hoc signature that macOS rejects
      # ("code or signature have been modified") — the binary is SIGKILLed
      # on launch, every build flavour, cross-compiled or native (measured
      # 2026-09-02 on Darwin 27). An ad-hoc re-sign repairs it, and only a
      # macOS runner has codesign, so the two darwin targets take a detour
      # (scripts/binary-launch.ts).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-unsigned
          path: packages/vx/dist/vx-darwin-*
          retention-days: 1

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/vx/dist/vx-linux-*

      - run: bun packages/vx/src/bin.ts run release.upload.linux --filter @vzn/vx

  sign-darwin:
    needs: assets
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      VX_RELEASE_VERSION: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-unsigned
          path: packages/vx/dist
      - name: Prove the darwin binaries launch (re-signed ad hoc where macOS refuses)
        run: bun packages/vx/src/bin.ts run release.prove.darwin --filter @vzn/vx
      # Attested after any re-sign: the bytes that ship are the signed ones.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/vx/dist/vx-darwin-*

      # The last upload publishes the draft: an immutable release takes
      # assets only before it is published (scripts/release-assets.ts).
      - run: bun packages/vx/src/bin.ts run release.upload.darwin --filter @vzn/vx
