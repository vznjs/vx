name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Computes the next tag from conventional commits since the last
      # release, creates + pushes the tag, and exports a markdown
      # changelog. `default_bump: patch` keeps unlabeled commits as
      # patches.
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Compile binaries
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --minify --bytecode --target=bun-$t \
              src/bin.ts --outfile "dist/vx-${{ steps.tag.outputs.new_tag }}-$t"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*
