name: Release assets

# Triggered when a maintainer publishes a release in the GitHub UI
# (or via `gh release create`). Compiles the binaries against the
# release's tag and attaches them to the release.
#
# Notes: the maintainer writes the release body manually (or uses
# GitHub's "Generate release notes" button). This workflow only
# uploads the four cross-target binaries as assets.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Compile binaries
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --minify --bytecode --target=bun-$t \
              src/bin.ts --outfile "dist/vx-${{ github.event.release.tag_name }}-$t"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
