name: Release assets

# Triggered when a maintainer publishes a release in the GitHub UI
# (or via `gh release create`). Runs `vx run build.bun` (which fans out
# to one task per target with per-binary caching), then attaches the
# four vx-<target> binaries (for the curl installer + `vx upgrade`)
# to the release.
# The maintainer writes the body manually.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # Stamp the release version into packages/vx/package.json BEFORE
      # compiling — `src/version.ts` inlines THAT manifest under
      # `bun build --compile`. Since core moved into packages/vx
      # (2026-08-26) this step stamped the ROOT manifest, which nothing
      # reads, so every binary would have reported `vx 0.0.0`; proven by
      # reproduction 2026-09-03 and asserted below. Ephemeral (CI only).
      - name: Stamp version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          bun -e 'const f = "packages/vx/package.json"; const p = await Bun.file(f).json(); p.version = process.argv[1]; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")' "$VERSION"

      # What a Linux runner needs before `vx run` executes a sandboxed task:
      # the sandbox runtime's deps (every task here declares `exec.sandbox`),
      # the AppArmor userns restriction Ubuntu 24 imposes lifted, and bun's
      # cross-compile targets warmed outside the sandbox. Shared with ci.yml
      # and npm.yml so the deps are named in ONE place — npm.yml not having
      # them is what stopped v0.0.20's publish.
      - uses: ./.github/actions/vx-runner

      # Dogfood: `build.bun` fans out to `build.bun.<target>` (four
      # compiles). Each sub-task is individually cached, so re-running this
      # workflow on the same commit is essentially free. --concurrency 2:
      # concurrent `--compile --minify --bytecode` builds OOM a 7 GB runner
      # (this workflow OOM'd before with only four).
      - run: bun packages/vx/src/bin.ts run build.bun --filter @vzn/vx --concurrency 2

      # The darwin binaries are RE-SIGNED before they ship. Bun 1.4.0's
      # `--compile` writes an ad-hoc signature that macOS rejects ("code or
      # signature have been modified") — the binary is SIGKILLed on launch,
      # every build flavour, cross-compiled or native (measured 2026-09-02 on
      # Darwin 27). An ad-hoc `codesign -s - --force` repairs it, and only a
      # macOS runner has codesign, so the two darwin targets take a detour.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-unsigned
          path: packages/vx/dist/vx-darwin-*
          retention-days: 1

      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: packages/vx/dist/vx-linux-*

  sign-darwin:
    needs: assets
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-unsigned
          path: dist
      - name: Re-sign ad hoc and prove the arm64 binary launches
        run: |
          chmod +x dist/vx-darwin-*
          for f in dist/vx-darwin-*; do codesign -s - --force "$f"; codesign --verify --verbose=2 "$f"; done
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          GOT="$(./dist/vx-darwin-arm64 --version)"
          test "$GOT" = "vx $VERSION" || { echo "binary reports '$GOT', expected 'vx $VERSION' — the version stamp missed the manifest the binary inlines"; exit 1; }
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/vx-darwin-*
