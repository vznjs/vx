# TEMPORARY experiment (cold-margin thread), removed before merge.
name: Cold A/B

on:
  push:
    branches: [claude/project-thread-y47kmj]
    paths: [.github/workflows/cold-ab.yml, private/vx-bench/ci-ab.ts, packages/vx/src/**]

permissions: {}

jobs:
  ab:
    name: Cold A/B ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: ROUNDS=2 bun private/vx-bench/ci-ab.ts
