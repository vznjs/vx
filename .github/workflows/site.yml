name: Site

# Deploys the docs site (@vzn/vx-docs#deploy.pages) with the newest
# numbers bench.yml measured on main: on each push to main, so a site
# change is live in minutes, and again once a Bench run ends, so its
# numbers are (2026-11-06: the deploy waited ~35 min on the bench).
# Either way it ships main's newest commit: a Bench run that ends after
# main moved on puts its numbers on that commit's site, never back on
# its own.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Bench]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, never cancelled halfway; of those queued
# meanwhile, only the newest runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reading bench.yml's `bench-data` artifact.
      actions: read
      # The Pages deployment and vxCache()'s sign-in, both by OIDC.
      id-token: write
      pages: write
      # The cache server's Workers Builds check names a PR's Preview.
      checks: read
    env:
      VX_CACHE_URL: https://vx-cache.exelord.workers.dev
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: Pick the cache server
        id: cache
        run: bun private/vx-servers/worker-url.ts private/vx-cache-service VX_CACHE_URL
      # The artifacts API lists the newest first: the last numbers a Bench
      # run on main measured. None found fails the deploy, never ships the
      # committed copy, older than the live one.
      - name: Use the newest measured numbers
        run: |
          run=$(gh api "repos/$GH_REPO/actions/artifacts?name=bench-data&per_page=30" --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0].workflow_run.id // empty')
          [ -n "$run" ] || { echo "no bench-data artifact from main" >&2; exit 1; }
          gh run download "$run" -n bench-data -D private/vx-docs/measured
          cp private/vx-docs/measured/bench.json private/vx-docs/src/data/bench.json
      # GitHub hands the job's runtime token, which uploads the site's
      # artifact, only to JavaScript actions: this hands it to the run,
      # whose env isolation passes it to the deploy task alone.
      - name: Hand the Pages token to the run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL)
      - name: Deploy the site
        env:
          VX_CACHE_URL: ${{ steps.cache.outputs.url || env.VX_CACHE_URL }}
        run: bun packages/vx/src/bin.ts run @vzn/vx-docs#deploy.pages
