name: Auto release

# Releases on demand: a maintainer or Claude dispatches this (daily when
# main has changes; .claude/skills/release/SKILL.md). It releases the
# given commit, or by default the newest main commit whose CI went green,
# and refuses one CI did not pass. It tags it with the next version and
# creates the GitHub release, both from the Conventional Commits since the
# last tag (packages/vx/scripts/release-notes.ts: from 0.1.0, which the
# owner cuts by hand, a feat or a breaking change is a minor before 1.0,
# the rest a patch), then dispatches the two release workflows.
#
# A commit is released only when the last release is its ancestor, so an
# older tree can never get a higher version, and an already tagged one is
# a no-op. `concurrency` keeps two releases from racing for the same
# number.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to release; empty releases the newest one whose CI went green.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the GitHub release
      actions: write # dispatching npm.yml and release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # `release.auto` declares `exec.sandbox`; see ci.yml.
      - uses: ./.github/actions/vx-runner

      # Pick the commit, decide the version, write the notes, tag, release
      # and dispatch the two workflows that build and publish it
      # (scripts/auto-release.ts).
      # The checkout's full history carries every tag, and `concurrency`
      # keeps another release from landing while this one decides.
      - name: Release
        env:
          VX_RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bun packages/vx/src/bin.ts run release.auto --filter @vzn/vx
