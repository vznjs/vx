name: Bench

# The site's head-to-head data (@vzn/vx-docs#bench.data), on a runner of
# its own and one runner at a time: a benchmark never runs under DTE,
# where a worker is packed beside other tasks. `--force` measures every
# runner in this one job, on this one machine: rows restored from another
# runner's run timed other CPUs. It uploads the rows as the `bench-data`
# artifact; main's next DTE run deploys them (@vzn/vx-docs#deploy.pages).
#
# Its own workflow (2026-11-06): inside ci.yml it held main's run open
# for its ~35 min, and main's next run queued behind it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One measurement at a time, never cancelled halfway; of the pushes that
# land meanwhile, only the newest is measured next.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: Bench
    # BENCH_RUNNER names the machine kept for benchmarks (a self-hosted
    # runner's label): one runner takes one job at a time, so Bench and
    # Perf never time each other. Unset, each gets a fresh hosted VM.
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      # vxCache() signs in to the cache server with the job's OIDC token.
      id-token: write
      # The cache server's Workers Builds check names a PR's Preview.
      checks: read
    env:
      VX_CACHE_URL: https://vx-cache.exelord.workers.dev
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      VX_REQUIRE_SANDBOX: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: Pick the cache server
        if: github.ref == 'refs/heads/main'
        id: cache
        run: bun private/vx-servers/worker-url.ts private/vx-cache-service VX_CACHE_URL
      - name: vx run bench.data
        env:
          VX_CACHE_URL: ${{ steps.outputs.url || env.VX_CACHE_URL }}
        run: bun packages/vx/src/bin.ts run @vzn/vx-docs#bench.data --concurrency 1 --force
      - name: Upload the benchmark data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-data
          path: private/vx-docs/measured/bench.json
