name: Real repos

# The real-repo bench (@vzn/vx-bench#bench.real, private/vx-bench/real/):
# public repos cloned at their pins, on native vx config, timed against the
# tool each ships with. Weekly or dispatched, on the benchmark machine, one
# run at a time: never under DTE, never on a PR. It uploads the refreshed
# rows as the `real-repos` artifact, as bench.yml uploads its own; the
# site's real-repos page renders private/vx-bench/real-repos.json once a
# commit brings them in. A case vx loses fails the run (a LOSS line).

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: real-repos
  cancel-in-progress: false

jobs:
  real-repos:
    name: Real repos
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The repos' own builds and tools run on Node; each pins its pnpm in
      # `packageManager`, which pnpm fetches itself.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.19.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bench.real runs unsandboxed, but a Linux job installs the runtime
      # before any vx task (workflow-runner law).
      - name: Restore the sandbox packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vx/setup-debs
          key: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}
          restore-keys: vx-setup-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up the sandbox
        run: bun packages/vx/src/bin.ts setup github
      - name: vx run bench.real
        run: bun packages/vx/src/bin.ts run @vzn/vx-bench#bench.real --concurrency 1
      - name: Upload the real-repo rows
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-repos
          path: private/vx-bench/real-repos.json
