<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">No daemon: fresh workspace reads</title>
  <desc id="description">Retained synthetic layered timings from 2026-10-04, one repetition per runner/state: fully cached vx 393 ms, Nx 6.45 s and Turborepo 463 ms. Nx's daemon was off under CI=1 in this measurement, though it is on by default locally. This is not a universal speed ranking. CPU accounting excludes detached daemons.</desc>
  <metadata>Regenerate with bun packages/vx-docs/scripts/scope-feature-covers.ts</metadata>
  <defs>
    <radialGradient id="wash"><stop offset="0" stop-color="#c6f84e" stop-opacity="0.08"/><stop offset="1" stop-color="#c6f84e" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="0.7" fill="#91988e" opacity="0.16"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#090c0c"/>
  <ellipse cx="100" cy="30" rx="620" ry="480" fill="url(#wash)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <g font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif">
    <rect x="72" y="243" width="12" height="12" rx="3" fill="#c6f84e"/>
    <text x="98" y="257" fill="#c6f84e" font-family="'IBM Plex Mono', Menlo, monospace" font-size="18" font-weight="600" letter-spacing="1">DAEMONLESS DESIGN · RETAINED TIMINGS</text>
    <text x="72" y="333" fill="#f2f4f0" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="72" font-weight="700">No daemon.</text>
    <text x="72" y="411" fill="#c6f84e" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Fresh workspace reads.</text>
    <text fill="#c5ccc5" font-size="27">
      <tspan x="72" y="472">Every invocation reads the workspace fresh.</tspan>
      <tspan x="72" y="513">These timings describe a synthetic graph,</tspan>
      <tspan x="72" y="554">not compilation or a universal ranking.</tspan>
      <tspan x="72" y="595">Nx's daemon was off under CI=1.</tspan>
    </text>
    <rect x="768" y="190" width="760" height="478" rx="20" fill="#0d1113" stroke="#303b3e"/>
    <rect x="1000" y="254" width="176" height="362" fill="#c6f84e" opacity="0.045"/>
    <g font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="600">
      <text x="1024" y="232" fill="#c6f84e">VX</text>
      <text x="1200" y="232" fill="#919a94">NX</text>
      <text x="1350" y="232" fill="#919a94">TURBOREPO</text>
    </g>
    <path d="M768 254 H1528 M768 354 H1528 M768 426 H1528 M768 502 H1528 M768 616 H1528" stroke="#283031"/>
    <g fill="#f2f4f0" font-size="23" font-weight="600">
      <text x="792" y="290">Background</text><text x="792" y="321">daemon</text>
      <text x="792" y="398">Timed CI run</text>
      <text x="792" y="474">Fully cached run</text>
      <text x="792" y="546">Process per task</text>
    </g>
    <g fill="#c6f84e" font-size="24">
      <text x="1024" y="312">None</text><text x="1024" y="398">None</text>
      <text x="1024" y="474">393 ms</text>
      <text x="1024" y="546">Your</text><text x="1024" y="577">command</text>
    </g>
    <g fill="#c5ccc5" font-size="23">
      <text x="1200" y="290">On by default</text><text x="1200" y="320">locally</text>
      <text x="1200" y="398">Off (CI=1)</text><text x="1200" y="474">6.45 s</text>
      <text x="1200" y="546">Node</text><text x="1200" y="577">fork</text>
      <text x="1350" y="290">None for</text><text x="1350" y="320">turbo run</text>
      <text x="1350" y="398">None</text><text x="1350" y="474">463 ms</text>
      <text x="1350" y="546">Your</text><text x="1350" y="577">command</text>
    </g>
    <text x="792" y="647" fill="#919a94" font-size="17">2026-10-04 · 1,090 packages · 3,270 nodes · one repetition</text>
    <text x="72" y="706" fill="#aeb6af" font-size="21">CPU counts the invocation and waited-for task shells; detached daemons are excluded.</text>
    <text x="72" y="744" fill="#c6f84e" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20">Benchmark context: /benchmarks/#synthetic-scheduling-counterexample</text>
    <path d="M72 778 H1528" stroke="#283031"/>
    <g transform="translate(72 818) scale(1.4)">
      <rect x="1" y="1" width="30" height="30" rx="7" fill="#090c0c" stroke="#c6f84e" stroke-width="1.5"/>
      <path d="M6 9.5 L11.5 22 L13.8 22 L8.3 9.5 Z M19 9.5 L25.8 9.5 L18 22 L15.7 22 L23 9.5 Z M18.4 9.5 L26 22 L23.7 22 L16.1 9.5 Z" fill="#c6f84e"/>
    </g>
    <text x="134" y="851" fill="#f2f4f0" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="32" font-weight="700">vx</text>
    <text x="1037" y="850" fill="#c6f84e" font-family="'IBM Plex Mono', Menlo, monospace" font-size="21" font-weight="600">npm i -D @vzn/vx</text>
    <text x="1255" y="850" fill="#919a94" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20">· github.com/vznjs/vx</text>
  </g>
</svg>
