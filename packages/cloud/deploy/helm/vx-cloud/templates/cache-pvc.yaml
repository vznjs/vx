{{- if eq .Values.cache.backend "fs" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vx-cloud.fullname" . }}-cache
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  accessModes:
    # RWX so every worker + the coordinator share one content-addressed store.
    - {{ .Values.cache.fs.accessMode }}
  {{- with .Values.cache.fs.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cache.fs.size }}
{{- end -}}
