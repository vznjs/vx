{{- if eq .Values.mode "local" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vx-cloud.fullname" . }}-serve
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  # Collapsed-local is a single process; do not scale it (one shared in-process
  # ready-queue + cache). Run multiple replicas only with mode: hosted.
  replicas: {{ .Values.serve.replicas }}
  selector:
    matchLabels:
      {{- include "vx-cloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        {{- include "vx-cloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: serve
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vx-cloud.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: serve
          image: {{ include "vx-cloud.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            {{- if .Values.serve.ui }}
            - --ui
            {{- end }}
            - --port
            - {{ .Values.serve.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.serve.port }}
          env:
            {{- include "vx-cloud.commonEnv" . | nindent 12 }}
            {{- if eq .Values.insights.store "sqlite" }}
            - name: VX_CLOUD_INSIGHTS_STORE
              value: "sqlite"
            - name: VX_CLOUD_INSIGHTS_DIR
              value: {{ .Values.insights.sqlite.mountPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /version
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.serve.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.cache.backend "fs" }}
            - name: cache
              mountPath: {{ .Values.cache.fs.mountPath }}
            {{- end }}
            {{- if eq .Values.insights.store "sqlite" }}
            - name: insights
              mountPath: {{ .Values.insights.sqlite.mountPath }}
            {{- end }}
      volumes:
        {{- if eq .Values.cache.backend "fs" }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "vx-cloud.fullname" . }}-cache
        {{- end }}
        {{- if eq .Values.insights.store "sqlite" }}
        - name: insights
          persistentVolumeClaim:
            claimName: {{ include "vx-cloud.fullname" . }}-insights
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vx-cloud.fullname" . }}-serve
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  type: ClusterIP
  selector:
    {{- include "vx-cloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: serve
  ports:
    - name: http
      port: {{ .Values.serve.port }}
      targetPort: http
      protocol: TCP
{{- end -}}
