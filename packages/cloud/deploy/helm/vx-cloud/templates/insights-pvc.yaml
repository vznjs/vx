{{- if eq .Values.insights.store "sqlite" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vx-cloud.fullname" . }}-insights
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: insights
spec:
  accessModes:
    # ReadWriteOnce — only the (single) coordinator opens cache.db.
    - ReadWriteOnce
  {{- with .Values.insights.sqlite.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.insights.sqlite.size }}
{{- end -}}
