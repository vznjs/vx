{{- if and (eq .Values.mode "hosted") .Values.coordinator.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vx-cloud.fullname" . }}-coordinator
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  {{- with .Values.coordinator.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.coordinator.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.coordinator.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.coordinator.ingress.host | quote }}
      secretName: {{ .Values.coordinator.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.coordinator.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vx-cloud.fullname" . }}-coordinator
                port:
                  name: http
{{- end -}}
