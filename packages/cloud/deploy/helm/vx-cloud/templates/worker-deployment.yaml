{{- if eq .Values.mode "hosted" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vx-cloud.fullname" . }}-worker
  labels:
    {{- include "vx-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.minReplicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vx-cloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vx-cloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vx-cloud.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for the coord:drain -> worker:bye graceful handshake: on
      # SIGTERM the worker finishes its in-flight task before replying bye.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "vx-cloud.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            - --coordinator
            - {{ include "vx-cloud.coordinatorUrl" . }}
            - --capacity
            - {{ .Values.worker.capacity | quote }}
            {{- range .Values.worker.labels }}
            - --label
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "vx-cloud.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if eq .Values.cache.backend "fs" }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.cache.fs.mountPath }}
          {{- end }}
      {{- if eq .Values.cache.backend "fs" }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "vx-cloud.fullname" . }}-cache
      {{- end }}
{{- end -}}
