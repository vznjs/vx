# vx-cloud — the self-hosted CI platform, as a docker-compose stack.
#
#   VX_CLOUD_SECRET=$(openssl rand -hex 32) \
#     docker compose -f packages/cloud/deploy/docker-compose.yml up
#
# Then open http://localhost:4321 and REGISTER — the first account becomes the
# instance admin (signup then closes; invite others from the Admin area). Mint a
# CI token under Admin → Tokens and point your CI at it (see the "Distributed CI
# execution" + "Self-hosting" guides).
#
# Three services: the vx-cloud `server` (app), Postgres (system of record), and
# MinIO (S3-compatible artifact bucket). The app is STATELESS — all history is
# in Postgres, all artifact bytes in the bucket — so you can scale it out behind
# a load balancer. For a REAL deployment, drop the `minio`/`createbucket`
# services and point VX_CLOUD_S3_* at managed object storage (Cloudflare R2, AWS
# S3, …); and run behind a TLS-terminating reverse proxy so VX_CLOUD_BASE_URL is
# https:// (that flips session cookies to Secure).

# To put an HTTP/2 edge in front — one connection multiplexes many
# concurrent requests, no per-request handshake — add the `edge` profile:
#
#   VX_CLOUD_SECRET=$(openssl rand -hex 32) VX_CLOUD_BASE_URL=https://localhost \
#     docker compose --profile edge up
#
# Then open https://localhost (the app's own :4321 port is still published for
# direct/plain-HTTP access; drop the app `ports:` block to force all traffic
# through the proxy). See ./Caddyfile.
services:
  app:
    image: ghcr.io/vznjs/vx-cloud:latest
    # Or build in place: `docker compose build` picks this up.
    build:
      context: ../../..
      dockerfile: packages/cloud/Dockerfile
    ports:
      - '4321:4321'
    environment:
      # System of record — the compose Postgres below.
      DATABASE_URL: 'postgres://vx:vx@postgres:5432/vx'
      # Session + API-token HMAC secret (>= 32 chars). REQUIRED — no default.
      VX_CLOUD_SECRET: '${VX_CLOUD_SECRET:?set VX_CLOUD_SECRET — try: openssl rand -hex 32}'
      # The public origin users reach the dashboard at. https:// flips session
      # cookies to Secure — set it to your real proxied URL in production.
      VX_CLOUD_BASE_URL: '${VX_CLOUD_BASE_URL:-http://localhost:4321}'
      # Artifact bucket (the compose MinIO below). For production, point these at
      # R2/S3 and delete the minio/createbucket services. Partial S3 config is a
      # BOOT ERROR — never a silent local fallback.
      VX_CLOUD_S3_ENDPOINT: '${VX_CLOUD_S3_ENDPOINT:-http://minio:9000}'
      VX_CLOUD_S3_BUCKET: '${VX_CLOUD_S3_BUCKET:-vx-artifacts}'
      VX_CLOUD_S3_ACCESS_KEY_ID: '${VX_CLOUD_S3_ACCESS_KEY_ID:-vxminio}'
      VX_CLOUD_S3_SECRET_ACCESS_KEY: '${VX_CLOUD_S3_SECRET_ACCESS_KEY:-vxminiosecret}'
      VX_CLOUD_S3_REGION: '${VX_CLOUD_S3_REGION:-auto}'
      # Optional: VX_CLOUD_PORT (default 4321), VX_CLOUD_RETENTION_DAYS (180),
      # VX_CLOUD_S3_PREFIX, VX_CLOUD_S3_PRESIGN_TTL.
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vx
      POSTGRES_PASSWORD: vx
      POSTGRES_DB: vx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vx -d vx']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- S3-compatible object storage for artifact bytes (demo only) ---
  # Replace with managed R2/S3 in production (set VX_CLOUD_S3_* + delete these).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vxminio
      MINIO_ROOT_PASSWORD: vxminiosecret
    ports:
      - '9001:9001' # MinIO console (optional)
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # One-shot: create the bucket the server's boot S3-probe expects to exist.
  # Retries `mc alias set` until MinIO answers rather than gating on a MinIO
  # healthcheck — the server image has no preconfigured alias, so a
  # healthcheck-based gate can wedge the whole `up`.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set vx http://minio:9000 vxminio vxminiosecret; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing vx/vx-artifacts &&
      echo 'bucket vx-artifacts ready'
      "

  # --- Optional HTTP/2 edge proxy (`--profile edge`) ---
  # Terminates TLS + h1/h2 and reverse-proxies to the H1-only app; one h2
  # connection then multiplexes every concurrent request. See ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: ['edge']
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      VX_CLOUD_DOMAIN: '${VX_CLOUD_DOMAIN:-localhost}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
