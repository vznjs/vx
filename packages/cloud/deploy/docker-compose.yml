# vx-cloud — the whole service in one container.
#
#   # Uses the prebuilt image ghcr.io/vznjs/vx-cloud:latest (published by CI):
#   VX_CLOUD_TOKEN=$(openssl rand -hex 32) docker compose -f packages/cloud/deploy/docker-compose.yml up
#
#   # Or build from source: `docker compose build` picks up the build: block below.
#
# One process serves the dashboard, the /v1/* analytics API, the /v1/cache
# remote cache, and the /mcp endpoint. It reads only its own SQLite ingest
# store (the `vxdata` volume), fed by the cloud() plugin's POST /v1/ingest — it
# never touches a workspace cache.db, so it can run anywhere.
#
# There is no coordinator/worker fleet: distributed-execution `agent`s are
# per-CI-job processes (see the "Distributed CI execution" guide), not
# long-lived containers.

services:
  vx-cloud:
    image: ghcr.io/vznjs/vx-cloud:latest
    # Or build in place: `docker compose build` picks this up.
    build:
      context: ../../..
      dockerfile: packages/cloud/Dockerfile
    ports:
      - '4321:4321'
    environment:
      # A reachable (non-loopback) bind REQUIRES a token — an unauthenticated
      # serve on the network would expose task execution. Set both.
      VX_CLOUD_HOST: '0.0.0.0'
      VX_CLOUD_TOKEN: '${VX_CLOUD_TOKEN:?set VX_CLOUD_TOKEN to a secret}'
      # Optional: the fork-PR (untrusted) cache token. Its holder reads the
      # trusted cache but writes only the untrusted scope, so a fork PR warms
      # off main without being able to poison it. Safe to expose.
      # VX_CLOUD_PR_TOKEN: '${VX_CLOUD_PR_TOKEN:-}'
      # Optional: a browser origin allowed to open the WS/SSE channels when the
      # dashboard is hosted on a different origin than this serve.
      # VX_CLOUD_ALLOW_ORIGIN: 'https://dash.example.com'
      # Optional: store artifact BYTES in an S3-compatible bucket (R2, MinIO,
      # AWS) instead of the /data volume — the controller then holds no
      # artifact bytes at rest (GET redirects clients to pre-signed URLs; the
      # bucket endpoint must be reachable from the machines running `vx run`).
      # Setting the endpoint REQUIRES the bucket + credentials — partial
      # config is a boot error, never a silent local fallback.
      # VX_CLOUD_S3_ENDPOINT: 'https://<account-id>.r2.cloudflarestorage.com'
      # VX_CLOUD_S3_BUCKET: 'vx-artifacts'
      # VX_CLOUD_S3_ACCESS_KEY_ID: '${VX_CLOUD_S3_ACCESS_KEY_ID:-}'
      # VX_CLOUD_S3_SECRET_ACCESS_KEY: '${VX_CLOUD_S3_SECRET_ACCESS_KEY:-}'
      # VX_CLOUD_S3_REGION: 'auto'        # SigV4 region (default: auto)
      # VX_CLOUD_S3_PREFIX: 'vx-cache/'   # optional key prefix
      # VX_CLOUD_S3_PRESIGN_TTL: '300'    # presigned-GET TTL, seconds
    volumes:
      # Persist the ingest store + the artifact store across restarts (with
      # VX_CLOUD_S3_* set, artifacts live in the bucket instead).
      - vxdata:/data
    restart: unless-stopped

volumes:
  vxdata:
