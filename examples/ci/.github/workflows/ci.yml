# .github/workflows/ci.yml
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails if someone changed a vx.config.ts and did not run vx lock.
      - run: bun vx lock --check
      # main and a merge queue run every task. A pull request runs
      # only the projects it changed and the projects that depend on them.
      - run: >
          bun vx run ci
          ${{ github.event_name == 'pull_request'
            && '--affected'
            || '--all' }}
