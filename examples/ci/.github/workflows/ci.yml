name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun vx lock --check
      - run: >
          bun vx pipeline ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
